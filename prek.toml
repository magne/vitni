# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "no-commit-to-branch", args = ["--branch", "main"] },
    # Test fixtures are verbatim Digitalarkivet captures — never reformat them.
    { id = "trailing-whitespace", exclude = "^crates/vitni-digitalarkivet/tests/fixtures/" },
    { id = "end-of-file-fixer", exclude = "^crates/vitni-digitalarkivet/tests/fixtures/" },
    { id = "check-yaml" },
    { id = "check-toml" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all --check", language = "system", pass_filenames = false },
    { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings", language = "system", pass_filenames = false },
    { id = "xtask-check", name = "xtask static checks", entry = "cargo xtask check", language = "system", pass_filenames = false },
]
