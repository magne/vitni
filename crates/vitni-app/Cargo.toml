[package]
name = "vitni-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# AGPL-3.0-or-later, not the workspace default: this is an application crate (ADR 0034 §1).
license = "AGPL-3.0-or-later"
repository.workspace = true

[features]
default = ["sqlite"]
sqlite = ["vitni-db/sqlite"]
postgres = ["vitni-db/postgres"]

[dependencies]
vitni-core = { workspace = true }
vitni-db = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
dotenvy = { workspace = true }
whoami = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Media checksums (#359): a file-path write hashes the media-library file it names.
sha2 = { workspace = true }
# The `.vitni-backup` archive (ADR 0041 §1).
zip = { workspace = true }
unic-langid = { workspace = true, features = ["serde"] }
# The Google Map Tiles adapter (ADR 0033): session/tile/viewport-copyright requests. Map network I/O
# stays in the app layer (ADR 0008) — the renderer never fetches.
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
# Failure injection (#390): a test installs a SQLite trigger that aborts one event insert.
sqlx = { workspace = true, features = ["migrate"] }
# The cross-engine backup test (feature = "postgres"; ADR 0041 §2): one reused container, a fresh
# database per test. The `migrate` feature above provides the empty `Migrator` the helper requires.
test-containers-util = { version = "0.1.4", features = ["pg-sqlx"] }
# The record-matching benchmarks: criterion, and the event trait the bench's bulk-loaded rows are
# written through.
criterion = { workspace = true }
cqrs-es = { workspace = true }

[[bench]]
name = "similar"
harness = false

[lints]
workspace = true
