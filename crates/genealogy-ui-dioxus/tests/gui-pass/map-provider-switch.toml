# The Geography toolbar's provider select actually switches the running map (#283, ADR 0033): picking
# a configured provider persists it, resolves its MapSource, and repaints the canvas live, with no
# remount. The fixture seeds a second, inactive `[map.providers.demo]` MapLibre style
# (`demotiles.maplibre.org`) that looks nothing like the built-in OSM raster default, so a `differ`
# cannot be faked by an unrelated repaint.
#
# Coordinates are window pixels at 1800x1200, read off the shots this scenario writes. The provider
# select sits at the toolbar's far right; [1698, 113] is inside its closed control. `map-view.toml`
# once noted this control as undrivable — its own option list is a GTK popup rendered outside the
# window this harness screenshots, so the popup itself is never seen in a shot — but `xdotool key`
# reaches it anyway: keys go to the display's current keyboard focus, not to a named window, and the
# popup holds that focus while it is open. `Down` then `Return` moves off the built-in default (the
# select's first option) onto the one seeded provider and confirms it.
description = "The provider select switches the running map without a remount (#283, ADR 0033)"

[[step]]
do = "click"
at = [85, 881]
label = "rail: Geography"

[[step]]
do = "shot"
name = "map"

[[step]]
do = "click"
at = [1698, 113]
label = "toolbar: open the provider select"

[[step]]
do = "key"
chord = "Down"
label = "provider select: move to the next option (demo)"

[[step]]
do = "key"
chord = "Return"
label = "provider select: confirm the choice"

[[step]]
do = "shot"
name = "switched"

[[assert]]
kind = "differ"
shots = ["map", "switched"]
region = [500, 200, 1250, 700]
because = "switching to the demo MapLibre style must repaint the canvas — it looks nothing like the built-in OSM raster default"

[[assert]]
kind = "painted"
shot = "switched"
region = [500, 200, 1250, 700]
because = "the repaint must be actual tiles/vector layers, not a blank canvas left by a failed style fetch"
