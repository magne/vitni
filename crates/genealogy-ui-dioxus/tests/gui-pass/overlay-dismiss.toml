# Esc and click-away on the overlay layer. Both are `document::eval`/DOM-event behaviour that SSR
# asserts only as markup: the handler can be attached to the wrong element and every SSR test still
# passes — which is exactly what had happened (the dispatcher sits on `.app`, and every overlay renders
# as a sibling of `.app`, so no keydown inside one ever reached it).
#
# The `match` assertions are the load-bearing ones, and each compares against the shot taken
# *immediately before* that overlay opened — not against the first shot. Focus moves as a scenario
# runs, and a focus ring is a real pixel difference.
description = "Esc and click-away dismiss the command palette and the help overlay"

[[step]]
do = "shot"
name = "before-palette"

[[step]]
do = "key"
chord = "ctrl+k"
label = "palette: open with ⌘K"

[[step]]
do = "shot"
name = "palette-open"

[[step]]
do = "key"
chord = "Escape"
label = "palette: Esc"

[[step]]
do = "shot"
name = "palette-after-esc"

[[step]]
do = "key"
chord = "ctrl+k"
label = "palette: reopen"

[[step]]
do = "click"
at = [300, 1100]
label = "palette: click the scrim"

[[step]]
do = "shot"
name = "palette-after-click-away"

[[step]]
do = "shot"
name = "before-help"

[[step]]
do = "key"
chord = "question"
label = "help overlay: open with ?"

[[step]]
do = "shot"
name = "help-open"

[[step]]
do = "key"
chord = "Escape"
label = "help overlay: Esc"

[[step]]
do = "shot"
name = "help-after-esc"

[[assert]]
kind = "differ"
shots = ["before-palette", "palette-open"]
because = "⌘K must open the command palette"

[[assert]]
kind = "match"
shots = ["before-palette", "palette-after-esc"]
because = "Esc must dismiss the command palette"

[[assert]]
kind = "match"
shots = ["before-palette", "palette-after-click-away"]
because = "a click on the scrim must dismiss the command palette"

[[assert]]
kind = "differ"
shots = ["before-help", "help-open"]
# The sheet covers most of the window, so this is a large difference; the tolerance is raised above the
# default only to keep a *focus ring* from passing as an opened overlay, which is how this assertion
# first passed while `?` did nothing at all.
tolerance = 0.04
because = "? must open the shortcut help overlay"

[[assert]]
kind = "match"
shots = ["before-help", "help-after-esc"]
tolerance = 0.04
because = "Esc must dismiss the help overlay"
