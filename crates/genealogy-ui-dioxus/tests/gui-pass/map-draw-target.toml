# Finishing a shape with no draw target selected (#255) — a path `map-polygon.toml` cannot reach,
# because that scenario always clicks the rail row before drawing. The fixture seeds exactly one place
# (Kristiansand, `xtask/src/gui_pass.rs`) and nothing auto-selects it, so "no target" here is just
# "never click the rail row" before finishing the polygon.
#
# Trap: the toast is *not* an overlay — `.toast` has no `position` (`components.css`) and renders as a
# sibling grid row of the screen column, so showing it shrinks the map surface (and, post-#252, repaints
# the canvas) and moves the Finish/Clear row up from y=1048 to y=995. Clear's coordinate below is read
# off that post-toast layout, not off `map-polygon.toml`'s (pre-toast) row.
#
# Order matters: Clear is clicked *before* picking a place in the rail, not after. Picking a place
# recentres/zooms the map onto it (street level for Kristiansand), which pushes this scenario's
# world-view triangle entirely outside the viewport — a canvas-region `differ` comparing shots either
# side of that recentre would pass or fail on the recentre alone, not on whether the draft survived. So
# "the draft survives the refusal" is asserted *before* the rail click (refused vs cleared, same view),
# and "picking a place highlights it" is asserted last, over the rail region only (unaffected by canvas
# recentring either way).
#
# Coordinates are window pixels at 1800x1200, read off the shots this scenario writes.
description = "Finishing a shape with no draw target is refused, and the draft survives the refusal (#255)"

[[step]]
do = "click"
at = [85, 881]
label = "rail: Geography"

[[step]]
do = "shot"
name = "no-target"

[[step]]
do = "click"
at = [1536, 110]
label = "toolbar: Draw polygon"

[[step]]
do = "click"
at = [900, 400]
label = "map: first vertex"

[[step]]
do = "click"
at = [1200, 420]
label = "map: second vertex"

[[step]]
do = "click"
at = [1100, 700]
label = "map: third vertex"

[[step]]
do = "shot"
name = "ring-closed"

[[step]]
do = "click"
at = [517, 1048]
label = "Finish polygon"

[[step]]
do = "shot"
name = "refused"

[[step]]
do = "click"
at = [605, 995]
label = "Clear"

[[step]]
do = "shot"
name = "cleared"

[[step]]
do = "click"
at = [300, 185]
label = "place list: Kristiansand"

[[step]]
do = "shot"
name = "targeted"

[[assert]]
kind = "differ"
shots = ["ring-closed", "refused"]
because = "finishing with no draw target must say why instead of failing silently"

[[assert]]
kind = "differ"
shots = ["refused", "cleared"]
region = [500, 200, 1250, 700]
tolerance = 0.001
because = "a refused draft must survive on the canvas to be fixed, not be discarded"

[[assert]]
kind = "differ"
shots = ["cleared", "targeted"]
region = [208, 155, 240, 60]
because = "picking a place must highlight it as the draw target"
