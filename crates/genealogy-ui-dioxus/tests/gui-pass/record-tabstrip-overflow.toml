# #285's second instance — the record tabstrip, not a detail pane's tab strip.
#
# `.tabstrip .tabs-scroll` carries the same `overflow-x: auto` as `.tabs`, on an even shorter row, so
# it had the same defect: once the strip overflows, `WebKitGTK`'s horizontal scrollbar hit rectangle
# (~20px) covers the lower two thirds of every record tab — the label's own centre and the close `✕`
# with it.
#
# Six tabs overflow the strip at the app's own default 1280x840 window, which is a realistic count:
# one open record plus a create draft per category. `⌘N` adds an `OpenTab::Draft(Category)` tab
# without a save, so the tabs cost two steps each instead of a whole create form.
#
# Measured on this scenario's own `filled` shot: the `.rtab` box paints y 86-119 with the label glyphs
# on 99-107, and `.tabstrip`'s border-bottom on 121. Tab boxes are Kristiansand 582-698, New Places
# 705-832, New People 839-970, New Families 977-1115, New Events 1122-1230 — the last one clipped by
# the scroll box's right edge, which is the overflow this depends on. The click aims at New People's
# painted centre, (904, 103).
#
# The assertion is over the editor pane only, below the tabstrip. A region containing the strip could
# not tell a record switch from the sideways scroll the defect produced instead.
description = "A click at a record tab's painted centre switches records when the tabstrip overflows (#285)"
window = [1280, 840]

[[step]]
do = "click"
at = [85, 283]
label = "rail: Places"

[[step]]
do = "click"
at = [300, 99]
label = "explorer: Kristiansand"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Place draft"

[[step]]
do = "click"
at = [85, 175]
label = "rail: People"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Person draft"

[[step]]
do = "click"
at = [85, 211]
label = "rail: Families"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Family draft"

[[step]]
do = "click"
at = [85, 247]
label = "rail: Events"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Event draft"

[[step]]
do = "click"
at = [85, 319]
label = "rail: Sources"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Source draft — six tabs, past the strip's width"

[[step]]
do = "shot"
name = "filled"

[[step]]
do = "click"
at = [904, 103]
label = "record tab: New People, at the painted label's centre"

[[step]]
do = "shot"
name = "people-clicked"

[[assert]]
kind = "differ"
shots = ["filled", "people-clicked"]
region = [508, 130, 772, 600]
tolerance = 0.02
because = "clicking a record tab's painted label must switch records, not scroll the tabstrip (#285)"
