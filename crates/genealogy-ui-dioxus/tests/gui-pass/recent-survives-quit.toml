# #205: `RecentPersistenceManager` (`recent_persistence.rs`) persists the "Jump back in" list via a
# plain `use_effect`, plus a `CloseRequested`/`Destroyed` wry handler that reads the signal directly and
# backs the effect up — mirroring `WindowGeometryManager`'s established close-hook precedent
# (`window_geometry.rs`).
#
# `⌘Q` cannot exercise the backstop: it arrives as its own webview→Rust IPC round trip, so by the time
# it is processed the effect from opening the record (a separate, earlier IPC round trip) has already
# flushed — confirmed experimentally, including with the close-hook temporarily removed, and true no
# matter how tight the timing between the two steps is made. Xvfb also runs no window manager
# (`gui_pass.rs:49`), so there is no titlebar ✕ / session-logout / `wmctrl -c` here either — the actual
# path the handler exists for, an OS/WM-initiated close that reaches `CloseRequested` outside that IPC
# queue with an effect still pending. Neither this scenario nor this harness can drive that path; what
# this scenario does prove is that the manager is mounted and reads the right signal — it would fail if
# `RecentPersistenceManager` were left unmounted or wired to the wrong list.
#
# `ctrl+q` with nothing dirty runs `NavState::quit_now` immediately — no confirm dialog, see
# `unsaved-quit-confirm.toml`. `await-exit` then waits for the GUI process itself to exit, and the
# `manifest` assertion reads `target/gui-pass/workspace/workspace.toml` off disk, not a screenshot —
# the only way to prove the write reached disk rather than just the in-memory signal.
#
# Coordinates are window pixels at 1800x1200, read off `sidepanel-focus.toml` /
# `unsaved-quit-confirm.toml`, whose "rail: Places" and "explorer: Kristiansand" clicks match.
description = "The recent list survives a quit, not just an in-memory signal (#205)"

[[step]]
do = "click"
at = [85, 283]
label = "rail: Places"

[[step]]
do = "click"
at = [300, 99]
label = "explorer: Kristiansand"

[[step]]
do = "key"
chord = "ctrl+q"
label = "⌘Q with nothing dirty: quit_now runs with no confirm"

[[step]]
do = "await-exit"
label = "wait for the GUI process to exit"

[[assert]]
kind = "manifest"
contains = 'label = "Kristiansand"'
because = "opening Kristiansand must reach workspace.toml's recent list before the process exits"
