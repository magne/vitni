# Polygon drawing on the Geography map (#203) — the half of the map canvas `map-canvas.toml` does not
# reach: picking a place recentres the map, the polygon tool turns canvas clicks into a ring, and
# finishing it hands the geometry to the provenance panel. None of it exists under SSR, which renders no
# canvas and has no pointer.
#
# Two things are deliberately *not* asserted, because the app does not do them: polygon vertices are
# never drawn as handles (the draft's point layer is filtered to `Point` geometry, so a ≥3-vertex draft
# renders as fill + outline only, and a 1-vertex draft renders nothing at all), and there is no way to
# insert a vertex mid-ring. Both are backlog items, not verification gaps.
#
# Coordinates are window pixels at 1800x1200, read off the shots this scenario writes. The canvas
# region asserted below sits inside the surface both before and after the Finish/Clear row shrinks it.
#
# Also asserts the rail highlight and the toolbar draw-target chip (#255): the whole-window `differ`
# below passes today only because the map recentres, and says nothing about either. The chip sits
# before `span.spacer` in the toolbar (`.geo-toolbar .spacer { flex: 1 }` absorbs its width change), so
# it never moves the Pan/Point/Polygon/Fit toolbar buttons this scenario (and `map-canvas.toml`) clicks.
description = "The polygon tool turns canvas clicks into a ring and hands it to the geometry panel (#203)"

[[step]]
do = "click"
at = [85, 881]
label = "rail: Geography"

[[step]]
do = "shot"
name = "map"

[[step]]
do = "click"
at = [300, 185]
label = "place list: Kristiansand"

[[step]]
do = "shot"
name = "selected"

[[step]]
do = "click"
at = [1480, 110]
label = "toolbar: Draw polygon"

[[step]]
do = "shot"
name = "armed"

[[step]]
do = "click"
at = [900, 400]
label = "map: first vertex"

[[step]]
do = "shot"
name = "vertex-one"

[[step]]
do = "click"
at = [1200, 420]
label = "map: second vertex"

[[step]]
do = "shot"
name = "ring-open"

[[step]]
do = "click"
at = [1100, 700]
label = "map: third vertex"

[[step]]
do = "shot"
name = "ring-closed"

[[step]]
do = "click"
at = [517, 1048]
label = "Finish polygon"

[[step]]
do = "shot"
name = "geometry-panel"

[[assert]]
kind = "differ"
shots = ["map", "selected"]
because = "picking a place must recentre and zoom the map onto it"

[[assert]]
kind = "differ"
shots = ["map", "selected"]
region = [208, 155, 240, 60]
because = "the rail must highlight the row a drawn shape will attach to (#255)"

[[assert]]
kind = "differ"
shots = ["map", "selected"]
region = [520, 95, 260, 40]
because = "the toolbar must name the place a drawn shape will attach to (#255)"

[[assert]]
kind = "differ"
shots = ["selected", "armed"]
because = "arming the polygon tool must offer the finish and clear actions"

[[assert]]
kind = "painted"
shot = "armed"
region = [500, 200, 1250, 700]
# Until #252 this frame's canvas was flat: the row shrank the surface, MapLibre resized the canvas, and
# the repaint never composited. The `differ` above passed anyway — a blanked canvas differs too.
because = "the Finish/Clear row must not cost the map its tiles"

[[assert]]
kind = "differ"
shots = ["vertex-one", "ring-open"]
# Two vertices draw one thin red segment over a full-frame map: a few hundred pixels change, so the
# default same-screen tolerance would swallow it.
tolerance = 0.001
because = "a second vertex must draw the ring's first segment"

[[assert]]
kind = "differ"
shots = ["ring-open", "ring-closed"]
tolerance = 0.001
because = "a third vertex must close the ring and fill it"

[[assert]]
kind = "differ"
shots = ["ring-closed", "geometry-panel"]
because = "Finish polygon must open the geometry panel for the selected place"
