[package]
name = "genealogy-ui-dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "genealogy-gui"
path = "src/main.rs"

[features]
# The desktop renderer pulls a webview (libwebkit2gtk on Linux). It is opt-in so the components, the
# vocabulary interpreter, and the SSR test build without system webview libs; the GUI binary and the
# full `--all-features` CI build enable it.
default = []
desktop = ["dioxus/desktop", "dep:dark-light"]
# Shows the Preferences "Register workspace…" form's Database URL field, letting the GUI create a
# Postgres-backed workspace like `genealogy init --database-url` already can (ADR 0002). Opt-in
# because the default build only ever needs SQLite; off by default like `desktop`.
postgres = ["genealogy-app/postgres"]

[dependencies]
genealogy-ui = { workspace = true }
genealogy-app = { workspace = true }
genealogy-i18n = { workspace = true }
genealogy-plugin-host = { workspace = true }
dioxus = { workspace = true }
dark-light = { workspace = true, optional = true }
serde_json = { workspace = true }
# `sync` backs the assisted-import driver's mpsc/oneshot channels between the plugin invocation and the
# wizard (ADR 0017 §5); `async-trait` makes the channel-backed `Presenter` object-safe.
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
unic-langid = { workspace = true }

[dev-dependencies]
dioxus-ssr = { workspace = true }
genealogy-core = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

# `.deb` packaging for the `genealogy-gui` GUI (Phase 11 workstream C, ADR 0014 §7). Built with
# `cargo deb -p genealogy-ui-dioxus -- --features desktop` (the webview renderer is off by default).
# `target/release/` is cargo-deb's special prefix; the plugin fleet and README use workspace-relative
# `../../` paths. `cargo xtask build-plugins` MUST run first. Runtime webview deps are declared beside
# `$auto` (the ones baked into the CI image / listed for Dioxus 0.7 desktop on Linux).
[package.metadata.deb]
name = "genealogy-gui"
maintainer = "Magne Rasmussen <magne.rasmussen@corporater.com>"
copyright = "2026, The genealogy authors"
extended-description = "Event-sourced genealogy program (desktop GUI). A Dioxus/webview frontend over the same event-sourced core as the CLI, bundling the signed first-party plugin fleet."
section = "misc"
priority = "optional"
depends = "$auto, libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1"
assets = [
    ["target/release/genealogy-gui", "usr/bin/", "755"],
    ["assets/genealogy.desktop", "usr/share/applications/", "644"],
    ["assets/genealogy.png", "usr/share/pixmaps/", "644"],
    ["../../target/plugins/**/*", "usr/lib/genealogy/plugins/", "644"],
    ["../../README.md", "usr/share/doc/genealogy-gui/README.md", "644"],
]

# Interactive GUI: startup diagnostics go to stdout/stderr, so the print lints are relaxed (as in
# genealogy-cli). The rest of the workspace's strict lints are duplicated (the `[lints]` table can't
# both inherit and override).
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "allow"
print_stderr = "allow"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
