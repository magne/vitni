[package]
name = "genealogy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "genealogy"
path = "src/main.rs"

[dependencies]
genealogy-core = { workspace = true }
# Compile both storage backends so the shipped binary selects the engine per workspace at runtime
# from each workspace's `database_url` (ADR 0002).
genealogy-app = { workspace = true, features = ["sqlite", "postgres"] }
genealogy-plugin-host = { workspace = true }
genealogy-i18n = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
unic-langid = { workspace = true }
icu = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

# `.deb` packaging for the `genealogy` CLI (Phase 11 workstream C, ADR 0014 §7). Built with the
# `cargo deb` subcommand (a CI/dev tool, never a workspace dependency): `cargo deb -p genealogy-cli`.
# `target/release/` is cargo-deb's special prefix (rewritten to the real target dir); `target/plugins`
# has no such rewrite, so the fleet is referenced via the workspace-relative `../../target/plugins`.
# `cargo xtask build-plugins` MUST run first so the signed bundles exist. The fleet installs to a
# system path; a packaged binary resolves it via `GENEALOGY_PLUGIN_DIR=/usr/lib/genealogy/plugins`
# (see docs/release.md — teaching the loader a default system embedded path is a residual).
[package.metadata.deb]
name = "genealogy"
maintainer = "Magne Rasmussen <magne.rasmussen@corporater.com>"
copyright = "2026, The genealogy authors"
extended-description = "Event-sourced genealogy program (CLI). Import/export runs as sandboxed WebAssembly plugins with deny-by-default capabilities."
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/genealogy", "usr/bin/", "755"],
    ["../../target/plugins/**/*", "usr/lib/genealogy/plugins/", "644"],
    ["../../README.md", "usr/share/doc/genealogy/README.md", "644"],
]

# This crate is an interactive terminal app: stdout/stderr ARE the interface, so
# the print lints are allowed here. The rest of the workspace's strict lints are
# duplicated (the `[lints]` table can't both inherit and override).
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "allow"
print_stderr = "allow"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
# The interactive triage helpers thread many fields (date, place, event, name,
# ids); bundling them into a struct would obscure more than it clarifies here.
too_many_arguments = "allow"
