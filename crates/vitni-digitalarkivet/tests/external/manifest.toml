# External Digitalarkivet fixtures (ADR 0042 §3). These are real pages the project may not
# redistribute: `cargo xtask fetch-fixtures` downloads them into target/external-fixtures/digitalarkivet/
# and `tests/external.rs` checks each against its expected facts:
#
#     cargo xtask fetch-fixtures
#     cargo nextest run -p vitni-digitalarkivet --run-ignored only
#
# Only URLs, rights and transcribed facts are committed here (`transcribed-facts`, ADR 0042 §1); they
# are the records of the matching corpus's first pair (crates/vitni-core/matching/corpus/digitalarkivet.toml).
#
# `kind` is census-person, census-residence, churchbook-person or viewer. Every `expected` key is
# optional and only the ones given are checked: name, birth, role, occupation, scan_viewer_url and
# household (person pages); person_links (residence pages); source_title (both); image or
# no_image = true (viewers).

# `cargo xtask regen-fixtures` (ADR 0042 §4) rebuilds the bundled pages under tests/fixtures/ from the
# fetched ones: it prunes each page to the elements the parser reads, then replaces every remaining text
# and value through the page's `[page.substitute]` table (real → invented), keeping only what
# `vocabulary` lists verbatim. A value in neither fails the run, naming it, and so does a real value
# that survives into any output. `vocabulary` is for site labels and codes that name no one;
# `fixture` is each page's output under tests/fixtures/.
