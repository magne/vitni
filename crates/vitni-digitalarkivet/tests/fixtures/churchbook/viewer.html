<!DOCTYPE html>
<!--
  Invented test fixture (ADR 0042). A stand-in for the nye.digitalarkivet.no IIIF viewer: the
  scan is reached through a manifest the page's script loads, so the page carries no permanent
  image, no scan <img> and no .jpg link. The ids are made up and name no real scan.
-->
<html lang="no">
<head>
  <meta charset="utf-8">
  <title>Digitalarkivet - 00000000-0000-4000-8000-000000099901</title>
  <meta property="og:image" content="https://nye.digitalarkivet.no/images/og-image.png">
  <link rel="preload" as="fetch" href="https://nye.digitalarkivet.no/api/media-file/image/presentation/manifest/99901.json">
</head>
<body>
  <img src="https://nye.digitalarkivet.no/images/logo.svg" alt="Digitalarkivet">
  <main id="viewer" data-manifest="https://nye.digitalarkivet.no/api/media-file/image/presentation/manifest/99901.json"></main>
</body>
</html>
