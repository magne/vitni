[package]
name = "vitni-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# AGPL-3.0-or-later, not the workspace default: this is an application crate (ADR 0034 §1).
license = "AGPL-3.0-or-later"
repository.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:sqlite-es", "dep:sqlx", "dep:serde", "dep:async-trait", "dep:geo-types", "dep:geozero", "dep:sha2", "dep:tokio"]
postgres = ["dep:postgres-es", "dep:sqlx", "dep:serde", "dep:async-trait", "dep:geo-types", "dep:geozero", "dep:sha2", "dep:tokio"]

[dependencies]
vitni-core = { workspace = true }
cqrs-es = { workspace = true }
async-trait = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
# A task-local slot for the projection failures `cqrs-es` reports to a handler (`projection_failures`);
# already in the graph through sqlx's tokio runtime.
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
sqlite-es = { workspace = true, optional = true }
postgres-es = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
# WKB + R*Tree spatial index over Place geometry (ADR 0024 §3), sqlite backend only for now.
geo-types = { workspace = true, optional = true }
geozero = { workspace = true, optional = true }
# Parses the tag ids a list query reads back from `record_links` (ADR 0052 §6).
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
# Postgres-backed tests (feature = "postgres"): reuses one container per process, isolating each
# test in a fresh randomly-named database dropped on Drop.
vitni-test-postgres = { workspace = true }
# Projection-rebuild / hot-query benchmarks (Phase 11 workstream B).
criterion = { workspace = true }

[[bench]]
name = "store"
harness = false
required-features = ["sqlite"]

[lints]
workspace = true
