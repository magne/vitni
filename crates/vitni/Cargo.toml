[package]
name = "vitni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# AGPL-3.0-or-later, not the workspace default: this is an application crate (ADR 0034 §1).
license = "AGPL-3.0-or-later"
repository.workspace = true

[features]
# The GUI renderer pulls a webview (libwebkit2gtk on Linux) and is on by default: `vitni` with no
# arguments is meant to open the app (ADR 0035 §1). Building without it leaves a working CLI whose
# no-argument invocation reports that this build has no renderer.
default = ["gui"]
# `postgres` rides along because `vitni-cli` enables `vitni-app/postgres` unconditionally (ADR 0002),
# so this binary supports Postgres workspaces either way — leaving the renderer's flag off would hide
# Preferences' Database URL field in a build that can use it (ADR 0035 §5).
gui = ["vitni-ui-dioxus/desktop", "vitni-ui-dioxus/postgres"]

[dependencies]
vitni-cli = { workspace = true }
vitni-ui-dioxus = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }

# `.deb` packaging for the `vitni` launcher (ADR 0014 §7, ADR 0035 §7). Built with
# `cargo deb -p vitni` — the `gui` feature is default, so no `--features` flag. This is the package
# that opens a window, so it declares the webview runtime deps beside `$auto` (the ones baked into the
# CI image / listed for Dioxus 0.7 desktop on Linux); `vitni-cli`'s package stays headless.
# `target/release/` is cargo-deb's special prefix; the plugin fleet, the docs, and the renderer's
# committed `.desktop`/icon assets use relative paths out of this crate directory.
# `cargo xtask build-plugins` MUST run first.
[package.metadata.deb]
name = "vitni"
maintainer = "Magne Rasmussen <magne.rasmussen@gmail.com>"
copyright = "2026, Magne Rasmussen and the Vitni authors"
# The binary links the AGPL application crates, so the package's copyright file carries that text.
# The interchange crates it also links stay MIT OR Apache-2.0; NOTICE ships the mapping (ADR 0034).
# The skip-lines count is a *string* in cargo-deb's schema; an integer fails the manifest parse.
license-file = ["../../LICENSE-AGPL", "0"]
extended-description = "Event-sourced genealogy program. Opens the desktop GUI with no arguments and runs the terminal frontend with any, over one event-sourced core; import/export runs as sandboxed WebAssembly plugins with deny-by-default capabilities."
section = "misc"
priority = "optional"
depends = "$auto, libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1"
assets = [
    ["target/release/vitni", "usr/bin/", "755"],
    ["../vitni-ui-dioxus/assets/vitni.desktop", "usr/share/applications/", "644"],
    # The icon set generated by `cargo xtask icons` (#326): the `hicolor` theme is what a modern
    # desktop reads, `pixmaps` the fallback older ones still look in, and the symbolic variant is what
    # GNOME and the tray pick for small monochrome slots.
    ["../vitni-ui-dioxus/assets/icon/vitni-16.png", "usr/share/icons/hicolor/16x16/apps/vitni.png", "644"],
    ["../vitni-ui-dioxus/assets/icon/vitni-24.png", "usr/share/icons/hicolor/24x24/apps/vitni.png", "644"],
    ["../vitni-ui-dioxus/assets/icon/vitni-32.png", "usr/share/icons/hicolor/32x32/apps/vitni.png", "644"],
    ["../vitni-ui-dioxus/assets/icon/vitni-48.png", "usr/share/icons/hicolor/48x48/apps/vitni.png", "644"],
    ["../vitni-ui-dioxus/assets/icon/vitni-64.png", "usr/share/icons/hicolor/64x64/apps/vitni.png", "644"],
    ["../vitni-ui-dioxus/assets/icon/vitni-128.png", "usr/share/icons/hicolor/128x128/apps/vitni.png", "644"],
    ["../vitni-ui-dioxus/assets/icon/vitni-256.png", "usr/share/icons/hicolor/256x256/apps/vitni.png", "644"],
    ["../vitni-ui-dioxus/assets/icon/vitni-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/vitni-symbolic.svg", "644"],
    ["../vitni-ui-dioxus/assets/icon/vitni-48.png", "usr/share/pixmaps/vitni.png", "644"],
    ["../../target/plugins/**/*", "usr/lib/vitni/plugins/", "644"],
    ["../../README.md", "usr/share/doc/vitni/README.md", "644"],
    ["../../NOTICE", "usr/share/doc/vitni/NOTICE", "644"],
]

# The launcher prints nothing of its own — the no-renderer message lives in `vitni-ui-dioxus` — so it
# inherits the workspace lints unrelaxed, print lints included (ADR 0035 §4).
[lints]
workspace = true
