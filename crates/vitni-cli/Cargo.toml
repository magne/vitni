[package]
name = "vitni-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# AGPL-3.0-or-later, not the workspace default: this is an application crate (ADR 0034 §1).
license = "AGPL-3.0-or-later"
repository.workspace = true

[[bin]]
name = "vitni"
path = "src/main.rs"

[dependencies]
vitni-core = { workspace = true }
# Compile both storage backends so the shipped binary selects the engine per workspace at runtime
# from each workspace's `database_url` (ADR 0002).
vitni-app = { workspace = true, features = ["sqlite", "postgres"] }
vitni-plugin-host = { workspace = true }
vitni-i18n = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
unic-langid = { workspace = true }
icu = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

# `.deb` packaging for the `vitni` CLI (Phase 11 workstream C, ADR 0014 §7). Built with the
# `cargo deb` subcommand (a CI/dev tool, never a workspace dependency): `cargo deb -p vitni-cli`.
# `target/release/` is cargo-deb's special prefix (rewritten to the real target dir); `target/plugins`
# has no such rewrite, so the fleet is referenced via the workspace-relative `../../target/plugins`.
# `cargo xtask build-plugins` MUST run first so the signed bundles exist. The fleet installs to a
# system path; a packaged binary resolves it via `VITNI_PLUGIN_DIR=/usr/lib/vitni/plugins`
# (see docs/release.md — teaching the loader a default system embedded path is a residual).
[package.metadata.deb]
name = "vitni"
maintainer = "Magne Rasmussen <magne.rasmussen@gmail.com>"
copyright = "2026, Magne Rasmussen and the Vitni authors"
# The binary links the AGPL application crates, so the package's copyright file carries that text.
# The interchange crates it also links stay MIT OR Apache-2.0; NOTICE ships the mapping (ADR 0034).
# The skip-lines count is a *string* in cargo-deb's schema; an integer fails the manifest parse.
license-file = ["../../LICENSE-AGPL", "0"]
extended-description = "Event-sourced genealogy program (CLI). Import/export runs as sandboxed WebAssembly plugins with deny-by-default capabilities."
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/vitni", "usr/bin/", "755"],
    ["../../target/plugins/**/*", "usr/lib/vitni/plugins/", "644"],
    ["../../README.md", "usr/share/doc/vitni/README.md", "644"],
    ["../../NOTICE", "usr/share/doc/vitni/NOTICE", "644"],
]

# This crate is an interactive terminal app: stdout/stderr ARE the interface, so
# the print lints are allowed here. The rest of the workspace's strict lints are
# duplicated (the `[lints]` table can't both inherit and override).
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "allow"
print_stderr = "allow"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
# The interactive triage helpers thread many fields (date, place, event, name,
# ids); bundling them into a struct would obscure more than it clarifies here.
too_many_arguments = "allow"
