<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Vitni">
  <!-- Vitni app icon — notch tier, rasterised at 64 px (see xtask/src/icons.rs). The seal keeps one
       cut flat on its rim, 1.25 px deep here: the full tier's impressed ring is 0.45 px at this size
       and its chevron under a pixel wide, so both would read as dirt. The ruled lines go too — three
       1.75 px lines merge into a smear — which frees the lower third of the plate, so the mark grows
       slightly and centres. The 48 px tier uses the same geometry without the flat. -->
  <defs>
    <mask id="impression" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#ffffff"/>
      <path d="M75.90 49.96 L41.96 83.90 L22.16 64.10 L56.10 30.16 Z" fill="#000000"/>
    </mask>
  </defs>
  <rect width="256" height="256" rx="56" fill="#142132"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#ffffff"
        stroke-opacity="0.1" stroke-width="3"/>
  <g fill="#e0a92e" stroke="#e0a92e" stroke-linecap="round" stroke-linejoin="round"
     mask="url(#impression)">
    <path d="M66 74 L126 182" fill="none" stroke-width="30"/>
    <path d="M192 74 L126 182" fill="none" stroke-width="16"/>
    <circle cx="192" cy="74" r="10" stroke="none"/>
    <circle cx="126" cy="182" r="17" stroke="none"/>
  </g>
</svg>
