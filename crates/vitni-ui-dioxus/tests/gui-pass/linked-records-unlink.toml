# #416: Unlink on a person's Linked records tab restores two people. SSR renders the tab and the
# panel but cannot press them: this proves the row's Unlink arms the reason panel, and its confirm
# reaches `unlink_person` and refreshes the person list.
#
# The fixture seeds no persons, so the scenario creates John Smith and John Smyth (as
# matches-distinguish does) and decides them the same in the Matches compare view. The person tab then
# shows the cluster, whose Linked records tab sits last, past the visible tabs: clicking Timeline and
# pressing End selects it.
#
# The asserts are scoped to the People list (x 232-531) and the rail's People count, away from the
# notices at the bottom of the window.
#
# Coordinates are window pixels at 1800x1200, read off the shots this scenario writes.
description = "Unlink on Linked records restores two people (#416)"

[[step]]
do = "click"
at = [85, 175]
label = "rail: People"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Person draft"

[[step]]
do = "click"
at = [1150, 486]
label = "field: Given name"

[[step]]
do = "text"
text = "John"
label = "type: John"

[[step]]
do = "click"
at = [1150, 636]
label = "field: Surname"

[[step]]
do = "text"
text = "Smith"
label = "type: Smith"

[[step]]
do = "click"
at = [1754, 151]
label = "New person: Save"

[[step]]
do = "click"
at = [756, 101]
label = "tabstrip: +"

[[step]]
do = "click"
at = [825, 148]
label = "menu: New person"

[[step]]
do = "click"
at = [1150, 486]
label = "field: Given name"

[[step]]
do = "text"
text = "John"
label = "type: John"

[[step]]
do = "click"
at = [1150, 636]
label = "field: Surname"

[[step]]
do = "text"
text = "Smyth"
label = "type: Smyth"

[[step]]
do = "click"
at = [1754, 151]
label = "New person: Save"

[[step]]
do = "click"
at = [108, 749]
label = "rail: Matches"

[[step]]
do = "shot"
name = "table"

[[step]]
do = "click"
at = [1680, 391]
label = "person row: Compare"

[[step]]
do = "shot"
name = "compare"

[[step]]
do = "click"
at = [1690, 642]
label = "Same (reversible)"

[[step]]
do = "click"
at = [85, 175]
label = "rail: People"

[[step]]
do = "shot"
name = "merged"

[[step]]
do = "click"
at = [1735, 267]
label = "tab: Timeline"

[[step]]
do = "key"
chord = "End"
label = "End: the Linked records tab, the last"

[[step]]
do = "shot"
name = "linked"

[[step]]
do = "click"
at = [1647, 499]
label = "row I0002: Unlink"

[[step]]
do = "shot"
name = "panel"

[[step]]
do = "click"
at = [1609, 316]
label = "field: Reason for this change"

[[step]]
do = "text"
text = "different fathers"
label = "type: different fathers"

[[step]]
do = "click"
at = [1471, 434]
label = "panel: Unlink"

[[step]]
do = "shot"
name = "unlinked"

[[assert]]
kind = "differ"
shots = ["merged", "linked"]
because = "End from Timeline must select the Linked records tab"
region = [552, 300, 1228, 240]

[[assert]]
kind = "differ"
shots = ["linked", "unlinked"]
because = "after Unlink the person list shows both people again"
region = [232, 75, 299, 120]

[[assert]]
kind = "differ"
shots = ["merged", "unlinked"]
because = "the rail's People count goes back from 1 to 2"
region = [184, 162, 30, 22]
