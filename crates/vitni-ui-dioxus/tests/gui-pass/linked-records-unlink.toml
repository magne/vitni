# #416: Unlink on a person's Linked records tab restores two people. SSR renders the tab and the
# panel but cannot press them: this proves the row's Unlink arms the reason panel, and its confirm
# reaches `unlink_person` and refreshes the person list.
#
# The fixture seeds no persons, so the scenario creates John Smith and John Smyth (as
# matches-distinguish does) and decides them the same in the Matches compare view. The person tab then
# shows the cluster, whose Linked records tab sits last, past the visible tabs: clicking Timeline and
# pressing End selects it.
#
# The asserts are scoped to the People list and the rail's People count, away from the
# notices at the bottom of the window.
description = "Unlink on Linked records restores two people (#416)"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Person draft"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "John"
label = "type: John"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Smith"
label = "type: Smith"

[[step]]
do = "click"
at = { role = "button", text = "Save" }
label = "New person: Save"

[[step]]
do = "click"
at = { role = "button", text = "Create a new record" }
label = "tabstrip: +"

[[step]]
do = "click"
at = { role = "menuitem", text = "New person" }
label = "menu: New person"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "John"
label = "type: John"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Smyth"
label = "type: Smyth"

[[step]]
do = "click"
at = { role = "button", text = "Save" }
label = "New person: Save"

[[step]]
do = "click"
at = { role = "listitem", text = "Matches" }
label = "rail: Matches"

[[step]]
do = "shot"
name = "table"

[[step]]
do = "click"
at = { role = "button", text = "Compare I0001 with I0002" }
label = "person row: Compare"

[[step]]
do = "shot"
name = "compare"

[[step]]
do = "click"
at = { role = "button", text = "Same (reversible)" }
label = "Same (reversible)"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People"

[[step]]
do = "shot"
name = "merged"

[[step]]
do = "click"
at = { id = "tab-timeline" }
label = "tab: Timeline"

[[step]]
do = "key"
chord = "End"
label = "End: the Linked records tab, the last"

[[step]]
do = "shot"
name = "linked"

[[step]]
do = "click"
at = { role = "button", text = "Unlink John Smyth" }
label = "row I0002: Unlink"

[[step]]
do = "shot"
name = "panel"

[[step]]
do = "click"
at = { id = "retract-reason" }
label = "field: Reason for this change"

[[step]]
do = "text"
text = "different fathers"
label = "type: different fathers"

[[step]]
do = "click"
at = { role = "button", text = "Unlink", within = "dialog" }
label = "panel: Unlink"

[[step]]
do = "shot"
name = "unlinked"

[[assert]]
kind = "differ"
shots = ["merged", "linked"]
because = "End from Timeline must select the Linked records tab"
region = { id = "panel-overview", offset = [20, 13], size = [1228, 240] }

[[assert]]
kind = "differ"
shots = ["linked", "unlinked"]
because = "after Unlink the person list shows both people again"
region = { role = "listbox", offset = [0, 3], size = [299, 120] }

[[assert]]
kind = "differ"
shots = ["merged", "unlinked"]
because = "the rail's People count goes back from 1 to 2"
region = { role = "listitem", text = "People", offset = [176, 8], size = [30, 22] }
