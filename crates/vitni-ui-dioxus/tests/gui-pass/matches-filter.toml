# #414: the Matches tool's kind filter narrows the queue. SSR renders the three selects and their chosen
# values but cannot prove a change in the webview reaches the queue: this picks *Person* in the kind
# filter by keyboard and the fixture's media pair leaves the table, then *Every kind* brings it back.
#
# The fixture seeds two media of one checksum, which the engine proposes as a probable match, and no
# persons, so the scenario creates John Smith and John Smyth, as matches-distinguish.toml does.
#
# Every assertion is scoped to the matches table card, a region of `main` below the filters.
description = "The kind filter narrows the possible-matches queue (#414)"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Person draft"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "John"
label = "type: John"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Smith"
label = "type: Smith"

[[step]]
do = "click"
at = { role = "button", text = "Save" }
label = "New person: Save"

[[step]]
do = "click"
at = { role = "button", text = "Create a new record" }
label = "tabstrip: +"

[[step]]
do = "click"
at = { role = "menuitem", text = "New person" }
label = "menu: New person"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "John"
label = "type: John"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Smyth"
label = "type: Smyth"

[[step]]
do = "click"
at = { role = "button", text = "Save" }
label = "New person: Save"

[[step]]
do = "wait"
seconds = 7
label = "let the Created notice expire"

[[step]]
do = "click"
at = { role = "listitem", text = "Matches" }
label = "rail: Matches"

[[step]]
do = "shot"
name = "every-kind"

[[step]]
do = "click"
at = { id = "matches-kind" }
label = "filter: Kind"

[[step]]
do = "key"
chord = "Down"
label = "Down: Person"

[[step]]
do = "key"
chord = "Return"
label = "Return: choose it"

[[step]]
do = "shot"
name = "persons"

[[step]]
do = "click"
at = { id = "matches-kind" }
label = "filter: Kind — again"

[[step]]
do = "key"
chord = "Up"
label = "Up: Every kind"

[[step]]
do = "key"
chord = "Return"
label = "Return: choose it"

[[step]]
do = "shot"
name = "every-kind-again"

[[assert]]
kind = "differ"
shots = ["every-kind", "persons"]
because = "the Person filter drops the media pair from the table"
region = { role = "main", offset = [0, 136], size = [1568, 240] }

[[assert]]
kind = "match"
shots = ["every-kind", "every-kind-again"]
because = "Every kind lists both pairs again"
region = { role = "main", offset = [0, 136], size = [1568, 240] }
