# #412: an assisted record with no possible match never meets the host's Match stage — saving the scan
# goes straight to the summary. The record comes from the archive stand-in `gui-pass` serves
# (`xtask/src/archive_server.rs`), into the fixture, which holds no person it could match.
#
# The summary is proven by its Import another, which returns the wizard to its first stage: the step
# indicator then matches the one shot there before the import. Had a Match stage come up instead, the
# click would land inside the compare view and the indicator would still show Match.
description = "A record with no possible match goes from Save scan straight to the summary (#412)"

[[step]]
do = "click"
at = { role = "listitem", text = "Import" }
label = "rail: Import"

[[step]]
do = "click"
at = { role = "radio", text = "Assisted online import" }
label = "mode: Assisted online import"

[[step]]
do = "click"
at = { id = "import-url" }
label = "field: Record or search URL"

[[step]]
do = "wait"
seconds = 1
label = "let the assisted wizard finish painting"

[[step]]
do = "shot"
name = "source"

[[step]]
do = "text"
text = "https://www.digitalarkivet.no/census/person/pf01099901000101"
label = "type: the census person's URL"

[[step]]
do = "click"
at = { role = "button", text = "Fetch" }
label = "Fetch"

[[step]]
do = "wait"
seconds = 3
label = "let the plugin fetch the record"

[[step]]
do = "click"
at = { role = "button", text = "Import & next" }
label = "Confirm: Import & next"

[[step]]
do = "shot"
name = "save"

[[step]]
do = "click"
at = { role = "button", text = "Save scan" }
label = "Save scan"

[[step]]
do = "wait"
seconds = 3
label = "let the host plan the record"

[[step]]
do = "shot"
name = "after-save"

[[step]]
do = "click"
at = { role = "button", text = "Import another" }
label = "Summary: Import another"

[[step]]
do = "shot"
name = "again"

[[assert]]
kind = "differ"
shots = ["save", "after-save"]
because = "saving the scan writes the record and closes the dialog"

[[assert]]
kind = "match"
shots = ["source", "again"]
region = { role = "main", offset = [16, 203], size = [700, 40] }
because = "the record went straight to the summary, whose Import another starts over at Source"
