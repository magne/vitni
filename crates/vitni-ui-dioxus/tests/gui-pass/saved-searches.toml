[[assert]]
kind = "absent"
shot = "menu-after-delete"
element = { role = "menuitemradio", text = "Temp", within = "saved-menu" }
because = "the menu no longer lists the deleted search"

[[assert]]
kind = "present"
shot = "menu-after-delete"
element = { role = "menuitemradio", text = "Olsens", within = "saved-menu" }
because = "deleting one search leaves the other"
