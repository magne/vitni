[[assert]]
kind = "present"
shot = "narrowed"
element = { role = "option", text = "Anne Olsen", within = "explorer" }
because = "the search and the clause narrow the list"

[[assert]]
kind = "present"
shot = "narrowed"
element = { role = "button", text = "☆", within = "explorer" }
because = "no saved search is applied yet"

[[assert]]
kind = "present"
shot = "menu-empty"
element = { hook = "saved-menu" }
because = "the Saved button opens its menu"

[[assert]]
kind = "absent"
shot = "rename-disabled"
element = { id = "saved-name" }
because = "a disabled action stays focusable and clickable, so only the click guard stops Rename opening its field"

[[assert]]
kind = "absent"
shot = "menu-empty"
element = { role = "menuitemradio", within = "saved-menu" }
because = "no search is saved yet"

[[assert]]
kind = "present"
shot = "naming"
element = { id = "saved-name" }
because = "Save as new asks for the name in the menu"

[[assert]]
kind = "value"
shot = "naming"
element = { id = "saved-name" }
equals = "Annes"
because = "the name field holds what was typed"

[[assert]]
kind = "present"
shot = "saved"
element = { role = "status", text = "Annes" }
because = "saving raises a notice"

[[assert]]
kind = "present"
shot = "saved"
element = { role = "button", text = "★", within = "explorer" }
because = "the applied search turns the button to a filled star"

[[assert]]
kind = "manifest"
contains = '[[saved_searches]]'
because = "saving writes a [[saved_searches]] entry to workspace.toml"

[[assert]]
kind = "present"
shot = "cleared"
element = { role = "option", text = "Per Hansen", within = "explorer" }
because = "removing the chip and the search lists everyone again"

[[assert]]
kind = "value"
shot = "cleared"
element = { role = "searchbox", within = "explorer" }
equals = ""
because = "the search box is empty"

[[assert]]
kind = "present"
shot = "menu-one"
element = { role = "menuitemradio", text = "Annes", within = "saved-menu" }
because = "the saved search is listed in the menu"

[[assert]]
kind = "value"
shot = "applied"
element = { role = "searchbox", within = "explorer" }
equals = "olsen"
because = "applying fills the search box"

[[assert]]
kind = "present"
shot = "applied"
element = { role = "button", text = "Edit filter: Given name contains anne", within = "explorer" }
because = "applying rebuilds the chip"

[[assert]]
kind = "present"
shot = "applied"
element = { role = "option", text = "Anne Olsen", within = "explorer" }
because = "the applied list keeps Anne Olsen"

[[assert]]
kind = "absent"
shot = "applied"
element = { role = "option", text = "Berit Olsen", within = "explorer" }
because = "the applied list leaves out Berit Olsen, who does not match the clause"

[[assert]]
