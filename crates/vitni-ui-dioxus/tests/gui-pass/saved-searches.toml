# #680: saved searches. SSR renders the Saved button, its menu and the palette group, but cannot prove
# that the live webview saves a search to workspace.toml, that applying one refills the search box and the
# chips, or that the palette hands a search to its kind's list. This creates three persons, narrows the
# People list by a search and a clause, saves it as "Annes", clears the list and applies it back from the
# menu, renames it, runs it from the palette while the Places list is open, then saves a second search,
# "Temp", and deletes that one, checking the renamed search stays.
#
# Not covered here: a saved search with a marked (unrunnable) clause. The harness has no step that writes
# the manifest before the GUI starts and the fixture seed is shared by every scenario, so that path (the
# marked chip, no rows, removing it loads the list) is left to the free-function tests over
# `finish_saved_run` and the SSR tests. No `match` pair is used, so no `wait` outlasts the 6 s notice.
description = "Saved searches: save, apply, rename, run from the palette and delete (#680)"

