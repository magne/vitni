[[assert]]
kind = "present"
shot = "applied"
element = { role = "button", text = "★", within = "explorer" }
because = "the applied search is marked on the button"

[[assert]]
kind = "present"
shot = "renamed"
element = { role = "status", text = "Olsens" }
because = "renaming raises a notice"

[[assert]]
kind = "manifest"
contains = 'name = "Olsens"'
because = "the rename reaches workspace.toml"

[[assert]]
