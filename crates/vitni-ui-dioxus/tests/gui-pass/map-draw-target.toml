# Finishing a shape with no draw target selected (#255) — a path `map-polygon.toml` cannot reach,
# because that scenario always clicks the rail row before drawing. The fixture seeds exactly one place
# (Kristiansand, `xtask/src/gui_pass.rs`) and nothing auto-selects it, so "no target" here is just
# "never click the rail row" before finishing the polygon.
#
# The refusal toast renders in the shell's notice layer (#208), which is out of grid flow, so it no longer
# moves the Finish/Clear row: both Finish clicks below aim at the same y=1048. When the toast was a grid
# row it pushed that row up to y=995, and the second click stayed aimed there after #208. It then landed
# on the canvas and added a fourth vertex, which is what made `targeted`/`recovered` differ while the
# geometry panel never opened.
#
# "The draft survives the refusal" is asserted by *finishing again* after picking a place, not by
# clicking Clear and watching the ring vanish: Clear does erase the ring (`map-clear-draft.toml` covers
# it — the #282(b) report on this scenario turned out to be a compositor gap, not a state bug, fixed by
# forcing a redraw after the draft push), but a Clear/no-Clear compare here would only prove that fix,
# not this one. Re-finishing is the actual recovery path the refusal toast promises: the geometry panel
# can only open if the draft still held its three vertices.
#
# Coordinates are window pixels at 1800x1200, read off the shots this scenario writes.
description = "Finishing a shape with no draw target is refused, and the draft survives the refusal (#255)"

[[step]]
do = "click"
at = [85, 861]
label = "rail: Geography"

[[step]]
do = "shot"
name = "no-target"

[[step]]
do = "click"
at = [1480, 110]
label = "toolbar: Draw polygon"

[[step]]
do = "click"
at = [900, 400]
label = "map: first vertex"

[[step]]
do = "click"
at = [1200, 420]
label = "map: second vertex"

[[step]]
do = "click"
at = [1100, 700]
label = "map: third vertex"

[[step]]
do = "shot"
name = "ring-closed"

[[step]]
do = "click"
at = [541, 1048]
label = "Finish polygon"

[[step]]
do = "shot"
name = "refused"

[[step]]
do = "click"
at = [324, 220]
label = "place list: Kristiansand"

[[step]]
do = "shot"
name = "targeted"

[[step]]
do = "click"
at = [541, 1048]
label = "Finish polygon, again"

[[step]]
do = "shot"
name = "recovered"

[[assert]]
kind = "differ"
shots = ["ring-closed", "refused"]
because = "finishing with no draw target must say why instead of failing silently"

[[assert]]
kind = "differ"
shots = ["refused", "targeted"]
# The rail's Kristiansand row only. A whole-window compare here is answered by the recentre the
# selection triggers, which says nothing about the highlight this issue is about.
region = [232, 190, 240, 60]
because = "picking a place must highlight it as the draw target"

[[assert]]
kind = "differ"
shots = ["targeted", "recovered"]
# The geometry panel's header band, top right: a whole-window compare also passed when the click missed
# Finish and only added a vertex to the ring.
region = [1420, 30, 380, 60]
because = "a refused draft must survive, so finishing again with a target opens the geometry panel"
