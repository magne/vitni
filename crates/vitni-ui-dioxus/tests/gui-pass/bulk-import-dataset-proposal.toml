# #408: importing a file again into the workspace it came from, naming no dataset, opens the confirm
# once the file is read, starting on the proposed tree with the evidence for it, and Import anyway
# plans the file against it: every record already on record, nothing to write (#413). SSR renders the
# dialog alone; only the live app shows it opening mid-run, which needs the driver loop to wait on the
# progress stream and the host's question together.
#
# The fixture seeds `rerun.ged` beside the workspace's data without importing it, so the workspace is
# empty and the first import asks nothing.
description = "Re-importing a file opens the confirm on the proposed tree once the file is read (#408, #413)"

[[step]]
do = "click"
at = { role = "listitem", text = "Import" }
label = "rail: Import"

[[step]]
do = "click"
at = { id = "bulk-import-source" }
label = "source file field"

[[step]]
do = "text"
text = "rerun.ged"
label = "type: rerun.ged"

[[step]]
do = "click"
at = { role = "button", text = "Import" }
label = "Import"

[[step]]
do = "wait"
seconds = 3
label = "let the file be read and planned"

[[step]]
do = "click"
at = { role = "button", text = "Import" }
label = "Import, at the plan"

[[step]]
do = "wait"
seconds = 3
label = "let the import finish"

[[step]]
do = "shot"
name = "first-done"

[[step]]
do = "click"
at = { role = "button", text = "Import another" }
label = "Import another"

[[step]]
do = "shot"
name = "again"

[[step]]
do = "click"
at = { role = "button", text = "Import" }
label = "Import the same file again"

[[step]]
do = "wait"
seconds = 3
label = "let the file be read and the host ask"

[[step]]
do = "shot"
name = "asked"

[[step]]
do = "click"
at = { role = "button", text = "Import anyway" }
label = "Import anyway, into the proposed tree"

[[step]]
do = "wait"
seconds = 3
label = "let the file be planned"

[[step]]
do = "shot"
name = "replanned"

[[step]]
do = "click"
at = { role = "button", text = "Import" }
label = "Import, at the plan that writes nothing"

[[step]]
do = "wait"
seconds = 3
label = "let the import finish"

[[step]]
do = "shot"
name = "second-done"

[[assert]]
kind = "differ"
shots = ["again", "asked"]
because = "the second import must stop on the dataset confirm once the file is read"

[[assert]]
kind = "differ"
shots = ["asked", "replanned"]
because = "confirming the proposed tree must plan the file against it before writing"

[[assert]]
kind = "match"
shots = ["first-done", "second-done"]
because = "confirming the proposed tree must finish the import, as the first one did"
