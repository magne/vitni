# #411: the shared match-compare view decides a pair by keyboard alone. SSR renders the keys' hints
# but cannot prove the view takes focus when it opens, nor that a bare letter reaches its handler in
# the webview: this opens the view and presses `l` (Decide later — the pair stays proposed), opens it
# again and presses `y` (Same — the pair merges and leaves the table). No click lands on a decision.
#
# The fixture seeds no persons (and must not — every scenario is measured against its lists), so the
# scenario creates John Smith and John Smyth itself, as matches-distinguish.toml does.
#
# Every assertion is scoped to the matches table card, below the filters, where the person
# pair is the second row, after the fixture's two media of one checksum: the *Created* and decision notices
# repaint the bottom of the window. The baseline is shot with the pointer on the
# row, as it is after the Compare click, so the row's hover highlight is in both.
description = "The compare view decides a pair by keyboard: l leaves it proposed, y merges it (#411)"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Person draft"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "John"
label = "type: John"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Smith"
label = "type: Smith"

[[step]]
do = "click"
at = { role = "button", text = "Save" }
label = "New person: Save"

[[step]]
do = "click"
at = { role = "button", text = "Create a new record" }
label = "tabstrip: +"

[[step]]
do = "click"
at = { role = "menuitem", text = "New person" }
label = "menu: New person"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "John"
label = "type: John"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Smyth"
label = "type: Smyth"

[[step]]
do = "click"
at = { role = "button", text = "Save" }
label = "New person: Save"

[[step]]
do = "click"
at = { role = "listitem", text = "Matches" }
label = "rail: Matches"

[[step]]
do = "click"
at = { role = "cell", text = "Same given name" }
label = "row: an inert cell, so the baseline carries the row's hover like the later shot"

[[step]]
do = "shot"
name = "table"

[[step]]
do = "click"
at = { role = "button", text = "Compare I0001 with I0002" }
label = "person row: Compare"

[[step]]
do = "shot"
name = "compare"

[[step]]
do = "key"
chord = "l"
label = "l: Decide later"

[[step]]
do = "shot"
name = "later"

[[step]]
do = "click"
at = { role = "button", text = "Compare I0001 with I0002" }
label = "person row: Compare — again"

[[step]]
do = "key"
chord = "y"
label = "y: Same"

[[step]]
do = "shot"
name = "merged"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People — leave the tool"

[[step]]
do = "click"
at = { role = "listitem", text = "Matches" }
label = "rail: Matches — come back"

[[step]]
do = "shot"
name = "revisit"

[[assert]]
kind = "differ"
shots = ["table", "compare"]
because = "Compare must open the compare view for the proposed pair"
region = { role = "main", offset = [0, 136], size = [1568, 240] }

[[assert]]
kind = "match"
shots = ["table", "later"]
because = "l (Decide later) returns to the matches table with the pair still proposed"
region = { role = "main", offset = [0, 136], size = [1568, 240] }

[[assert]]
kind = "differ"
shots = ["table", "merged"]
because = "y (Same) merges the pair, which leaves the matches table"
region = { role = "main", offset = [0, 136], size = [1568, 240] }

[[assert]]
kind = "match"
shots = ["merged", "revisit"]
because = "y left the compare view for the table the merged pair is gone from, which stays so on a revisit"
region = { role = "main", offset = [0, 136], size = [1568, 240] }
