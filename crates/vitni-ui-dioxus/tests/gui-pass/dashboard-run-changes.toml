# #588: an import run's row on the Dashboard opens to the records it changed, and each record opens to
# what the run changed in it. #660: the records sit under a count line by kind, grouped by the source
# item they came from — Anders Strand's INDI leads the events, citation, media and note it wrote. SSR
# renders both disclosures closed and cannot load either level: only the live app reads the run's
# records, then one record's changes, on a click.
#
# The fixture seeds `rerun.ged` beside the workspace's data without importing it, so the scenario
# imports it first, then opens the Dashboard, whose newest row is that run.
description = "A run row opens to its records grouped by source item, and a record to its changes (#588, #660)"

[[step]]
do = "click"
at = { role = "listitem", text = "Import" }
label = "rail: Import"

[[step]]
do = "click"
at = { id = "bulk-import-source" }
label = "source file field"

[[step]]
do = "text"
text = "rerun.ged"
label = "type: rerun.ged"

[[step]]
do = "click"
at = { role = "button", text = "Import" }
label = "Import"

[[step]]
do = "wait"
seconds = 3
label = "let the file be read and planned"

[[step]]
do = "click"
at = { role = "button", text = "Import" }
label = "Import, at the plan"

[[step]]
do = "wait"
seconds = 3
label = "let the import finish"

[[step]]
do = "click"
at = { role = "listitem", text = "Dashboard" }
label = "rail: Dashboard"

[[step]]
do = "shot"
name = "folded"

[[step]]
do = "click"
at = { role = "button", text = "What the import from rerun.ged changed" }
label = "the rerun.ged run row's disclosure"

[[step]]
do = "shot"
name = "records"

[[step]]
do = "click"
at = { role = "button", text = "What it changed in Anders Strand" }
label = "Anders Strand's disclosure"

[[step]]
do = "shot"
name = "changes"

[[assert]]
kind = "absent"
shot = "folded"
element = { hook = "run-records" }
because = "the run's records are read only once its disclosure opens"

[[assert]]
kind = "present"
shot = "records"
element = { hook = "run-records" }
because = "the disclosure lists the records the run changed under its row"

[[assert]]
kind = "present"
shot = "records"
element = { hook = "run-counts", text = "3 persons" }
because = "a count line by kind heads the run's records"

[[assert]]
kind = "present"
shot = "records"
element = { hook = "run-group", text = "Anders Strand" }
because = "a source item's records group under its own entity"

[[assert]]
kind = "present"
shot = "records"
element = { role = "button", text = "What it changed in E0001", within = "run-group" }
because = "the records an item's parts wrote nest inside its group, each behind its own disclosure"

[[assert]]
kind = "focus"
shot = "records"
element = { role = "button", text = "What the import from rerun.ged changed" }
because = "focus stays on the disclosure that was activated"

[[assert]]
kind = "absent"
shot = "records"
element = { hook = "run-record-changes" }
because = "a record's changes are read only once it opens"

[[assert]]
kind = "present"
shot = "changes"
element = { hook = "run-record-changes" }
because = "the record's disclosure lays out what the run changed in it"

[[assert]]
kind = "differ"
shots = ["records", "changes"]
region = { role = "main" }
because = "the opened changes are drawn, not only mounted"
