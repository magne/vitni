# `SidePanel`'s focus trap (#247) — every assertion here is invisible to SSR, which renders the guards
# as markup but moves no focus: before the trap landed, focus never entered the panel, `Tab` walked
# straight out into the pane behind it, and `Esc` did nothing at all.
#
# The panel under test is the smallest one in the app — `retract_side_panel` on the Place Names tab,
# whose controls are exactly ✕ → the reason input → the Danger confirm. That count is what makes the
# cycle assertion sharp: three `Tab`s from any control must come back to it. Where focus sits is read
# from the probe (`focus`), not inferred from a focus ring's pixels.
#
# It is also the guard for the panel's `inert` background (#312), which SSR cannot see either: while
# the panel is open every region behind it is `inert`, so a missed unregister on close would leave the
# whole application frozen, and inerting the pane *blurs* the control that opened the panel — which is
# why the focus-restore assertion below is what caught both halves of that fix.
description = "A side panel takes focus, cycles Tab within itself, restores focus on Esc (#247), and leaves the shell interactive (#312)"

[[step]]
do = "click"
at = { role = "listitem", text = "Places" }
label = "rail: Places"

[[step]]
do = "click"
at = { role = "option", text = "Kristiansand Municipality P0001" }
label = "explorer: Kristiansand"

[[step]]
do = "click"
at = { id = "tab-names" }
label = "detail tab: Names"

[[step]]
do = "shot"
name = "before-open"

[[step]]
do = "click"
at = { role = "button", text = "Retract" }
label = "name row: Retract"

[[step]]
do = "shot"
name = "panel-open"

[[step]]
do = "key"
chord = "Tab"
label = "panel: Tab onto the reason input"

[[step]]
do = "shot"
name = "focus-first"

[[step]]
do = "key"
chord = "Tab"
label = "panel: Tab onto the confirm"

[[step]]
do = "key"
chord = "Tab"
label = "panel: Tab onto the trailing guard, which wraps to ✕"

[[step]]
do = "shot"
name = "focus-close"

[[step]]
do = "key"
chord = "Tab"
label = "panel: Tab back onto the reason input"

[[step]]
do = "shot"
name = "focus-cycled"

[[step]]
do = "key"
chord = "Escape"
label = "panel: Esc"

[[step]]
do = "shot"
name = "after-esc"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People — the shell must be interactive again"

[[step]]
do = "shot"
name = "shell-after-close"

[[assert]]
kind = "differ"
shots = ["before-open", "panel-open"]
because = "the Retract row action must open the side panel"

[[assert]]
kind = "focus"
shot = "focus-first"
element = { id = "retract-reason" }
because = "Tab from the panel's ✕ must move onto the reason input"

[[assert]]
kind = "focus"
shot = "focus-close"
element = { role = "button", text = "Cancel", within = "dialog" }
because = "Tab past the confirm must wrap to the panel's ✕ — without the guards focus walks out into the pane behind it"

[[assert]]
kind = "focus"
shot = "focus-cycled"
element = { id = "retract-reason" }
because = "Tab must cycle within the panel: three tab stops, so the fourth Tab lands back on the reason input"

[[assert]]
kind = "absent"
shot = "after-esc"
element = { role = "dialog" }
because = "Esc must dismiss the side panel"

[[assert]]
kind = "focus"
shot = "after-esc"
element = { role = "button", text = "Retract" }
# The load-bearing focus-restore assertion. Inerting the pane behind the panel blurs the control that
# opened it (#312), so focus only comes back to it if closing the panel restores it explicitly.
because = "closing the panel must restore focus to the control that opened it"

[[assert]]
kind = "differ"
shots = ["after-esc", "shell-after-close"]
# The unregister guard (#312): while a panel is open every region behind it is `inert`, and a missed
# unregister on close would leave the whole shell inert — an application that looks fine and answers
# nothing. A rail click that changes the view is the proof it came back.
because = "the shell must be interactive again once the panel closed"
