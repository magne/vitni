# The viewer's four zoom buttons did nothing at all, and SSR could not see it: the markup was right —
# an `aria-pressed` toggle and an inline width per step — while the geometry that width resolved
# against never existed. Three causes stacked, all of them CSS:
#
#   * `.media-full { width:100% }` (the record card's fixed-frame rule) outranked `Fit`'s
#     `max-width:100%`, so **Fit and 100% rendered identically**;
#   * `.crop-frame`/`.img-frame` both `overflow:hidden`, so a 150%/200% image was **clipped at the
#     frame** and `.mv-canvas`'s `overflow:auto` never got the chance to scroll;
#   * the frame was `display:inline-block` — shrink-to-fit — and a percentage-width child contributes
#     nothing to intrinsic width, so there was **no definite width for the percentage to resolve
#     against**. Circular, and browser-dependent.
#
# The fix moves the zoom onto the *frame*: it stays exactly the image's box (so percent crop geometry
# stays zoom-invariant, ADR 0017 §GUI) and is a definite percentage of the canvas at every step above
# Fit, which is what makes the canvas scroll instead of the frame clipping.
#
# The seeded image is 480x480 and the dialog's canvas is ~1030 wide, so the two states this scenario
# separates are visibly different sizes: at Fit the image is 480 wide and stops at x 1119, at 100% it
# fills the canvas. That is what the first `differ` reads — a region *beside* the Fit image, empty
# canvas at Fit and image at 100%. The second `differ` compares two different zoom levels over the same
# window rectangle, so it fails if a step is a no-op even when the first one passed.
#
# Coordinates are window pixels at the default 1800x1200, read off this scenario's own shots. The zoom
# buttons sit at y 301, with borders at x 639-670 (Fit), 675-726 (100%), 731-781 (150%) and 786-836
# (200%) — centres 655 / 700 / 756 / 811.
description = "Each viewer zoom step actually resizes the image, and Fit is not 100% (#309 follow-up)"

[[step]]
do = "click"
at = [85, 431]
label = "rail: Media"

[[step]]
do = "click"
at = [300, 99]
label = "explorer: the seeded portrait.png row"

[[step]]
do = "click"
at = [1150, 490]
label = "overview: the preview frame"

[[step]]
do = "shot"
name = "zoom-fit"

[[step]]
do = "click"
at = [700, 301]
label = "viewer: 100%"

[[step]]
do = "shot"
name = "zoom-100"

[[step]]
do = "click"
at = [811, 301]
label = "viewer: 200%"

[[step]]
do = "shot"
name = "zoom-200"

[[step]]
do = "click"
at = [655, 301]
label = "viewer: back to Fit"

[[step]]
do = "shot"
name = "zoom-back-to-fit"

[[assert]]
kind = "differ"
shots = ["zoom-fit", "zoom-100"]
# Beside the Fit image (which ends at x 1119) and inside the canvas: empty panel at Fit, image at 100%.
region = [1130, 400, 200, 120]
because = "Fit and 100% must not render identically — `.media-full`'s width:100% used to win over Fit's cap"

[[assert]]
kind = "differ"
shots = ["zoom-100", "zoom-200"]
region = [700, 400, 200, 120]
because = "200% must scale the image past the canvas and scroll, not clip at the frame"

[[assert]]
kind = "painted"
# Crossing the circle's right arc against the sky at 200%, where the image measures 0.2496; the middle
# of the frame is flat colour at this zoom (0.0104) and would answer for a blank stretched box.
region = [1450, 340, 200, 120]
shot = "zoom-200"
min_deviation = 0.05
because = "the zoomed image must still be the image's own bytes, not a blank stretched box"

[[assert]]
kind = "match"
shots = ["zoom-fit", "zoom-back-to-fit"]
because = "the zoom steps are reversible: Fit after 200% is the view Fit started at"
