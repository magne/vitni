# Issue #315's second half: the untag `×` takes a reason instead of committing immediately with
# `ProvenanceDraft::default()`. SSR can render the panel from an armed signal, but it cannot click a
# chip's delete button — so it cannot show that `ondelete` reaches `on_tag_remove`, that the callback now
# *arms the panel* rather than dispatching, or that the panel's own confirm is what removes the chip.
#
# The fixture seeds no tags (`xtask/src/gui_pass.rs`), so the scenario makes its own: `⌘N` on the Tags
# category creates one, and the place's Tags tab attaches it. That keeps the fixture as every other
# scenario measured it — a seeded tag would move the rail's Tags count and the Tags list in all of them.
#
# Coordinates are window pixels at 1800x1200, read off the shots this scenario writes; the chip's `×` was
# located by zooming its crop (`convert <shot> -crop 120x40+130+424 +repage -scale 400% <out>`), because
# it is 8 px of glyph beside the label it belongs to. The Tags tab's own coordinates moved with the shared
# tab frame (#303): the tab's explanation pushed the bar and the chips down, and the bar's button is now
# right-aligned, so `Add tag` sits at the pane's right edge rather than its left.
description = "Removing a tag opens the reason panel, and its confirm is what removes the chip (#315)"

[[step]]
do = "click"
at = [85, 564]
label = "rail: Tags"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Tag draft, Name autofocused"

[[step]]
do = "key"
chord = "t"
label = "type: t"

[[step]]
do = "key"
chord = "o"
label = "type: o"

[[step]]
do = "key"
chord = "d"
label = "type: d"

[[step]]
do = "key"
chord = "o"
label = "type: o"

[[step]]
do = "click"
at = [1754, 151]
label = "New tag: Save"

[[step]]
do = "click"
at = [85, 283]
label = "rail: Places"

[[step]]
do = "click"
at = [300, 99]
label = "explorer: Kristiansand"

[[step]]
do = "click"
at = [1367, 244]
label = "detail tab: Tags"

[[step]]
do = "click"
at = [1740, 380]
label = "Tags tab: + Add tag"

[[step]]
do = "click"
at = [1467, 698]
label = "Add tag panel: Save — the only tag is preselected"

[[step]]
do = "shot"
name = "chip"

[[step]]
do = "click"
at = [596, 420]
label = "tags: the todo chip's ×"

[[step]]
do = "shot"
name = "panel-open"

[[step]]
do = "key"
chord = "Tab"
label = "panel: Tab onto the reason field"

[[step]]
do = "key"
chord = "d"
label = "type: d"

[[step]]
do = "key"
chord = "u"
label = "type: u"

[[step]]
do = "key"
chord = "p"
label = "type: p"

[[step]]
do = "key"
chord = "e"
label = "type: e"

[[step]]
do = "shot"
name = "reason-typed"

[[step]]
do = "click"
at = [1490, 415]
label = "panel: Remove tag"

[[step]]
do = "shot"
name = "removed"

[[assert]]
kind = "differ"
shots = ["chip", "panel-open"]
# The side panel's own area. The chip is still on screen behind it, which is the point: the `×` must
# arm a panel, not remove anything yet.
region = [1420, 130, 380, 320]
because = "the chip's × must open the reason panel instead of committing the removal (#315)"

[[assert]]
kind = "differ"
shots = ["panel-open", "reason-typed"]
region = [1420, 280, 380, 60]
because = "the reason field must take the typing, which is the rationale the removal carries"

[[assert]]
kind = "differ"
shots = ["chip", "removed"]
# The chip's own row, left of the panel: the confirm is what removes it, and nothing before it did.
region = [528, 400, 300, 40]
because = "the panel's confirm must remove the tag, so the chip goes"

[[assert]]
kind = "differ"
shots = ["chip", "removed"]
region = [1336, 232, 74, 26]
because = "and the removal must reach the projection, so the Tags tab count goes 1 → 0"
