# #403: "Not the same" in the compare view records the decision, and the pair leaves the
# matches table for good. SSR renders the button but cannot press it: this proves the click reaches
# `distinguish_persons` through the screen's callbacks, that the screen returns to a table the pair has
# left, and that the pair stays gone after leaving the tool and coming back.
#
# The fixture seeds no persons (and must not — every scenario is measured against its lists), so the
# scenario creates John Smith and John Smyth itself, which the engine proposes as a possible match.
# After the first Save the record sits in edit mode, where ⌘N does not open a draft, so the second
# person comes from the tabstrip's "+" menu.
#
# Every assertion is scoped to the matches table card (a band of the main pane below the filters), where
# the person pair is the second row, after the fixture's two media of one checksum: the *Created* and
# decision notices repaint the bottom of the window, and the rail's selection moves between the visits.
description = "Not the same removes the pair from the matches table for good (#403)"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Person draft"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "John"
label = "type: John"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Smith"
label = "type: Smith"

[[step]]
do = "click"
at = { role = "button", text = "Save" }
label = "New person: Save"

[[step]]
do = "click"
at = { role = "button", text = "Create a new record" }
label = "tabstrip: +"

[[step]]
do = "click"
at = { role = "menuitem", text = "New person" }
label = "menu: New person"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "John"
label = "type: John"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Smyth"
label = "type: Smyth"

[[step]]
do = "click"
at = { role = "button", text = "Save" }
label = "New person: Save"

[[step]]
do = "click"
at = { role = "listitem", text = "Matches" }
label = "rail: Matches"

[[step]]
do = "shot"
name = "table"

[[step]]
do = "click"
at = { role = "button", text = "Compare I0001 with I0002" }
label = "person row: Compare"

[[step]]
do = "shot"
name = "compare"

[[step]]
do = "click"
at = { id = "merge-reason" }
label = "field: Reason for this decision"

[[step]]
do = "text"
text = "different fathers"
label = "type: different fathers"

[[step]]
do = "click"
at = { role = "button", text = "Not the same" }
label = "Not the same"

[[step]]
do = "shot"
name = "decided"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People — leave the tool"

[[step]]
do = "click"
at = { role = "listitem", text = "Matches" }
label = "rail: Matches — come back"

[[step]]
do = "shot"
name = "revisit"

[[assert]]
kind = "differ"
shots = ["table", "compare"]
because = "Compare must open the wizard for the proposed pair"
region = { role = "main", offset = [0, 136], size = [1568, 240] }

[[assert]]
kind = "differ"
shots = ["table", "decided"]
because = "after Not the same the screen returns to a matches table the pair has left"
region = { role = "main", offset = [0, 136], size = [1568, 240] }

[[assert]]
kind = "match"
shots = ["decided", "revisit"]
because = "a distinguished pair never reappears, not even after leaving the tool and coming back"
region = { role = "main", offset = [0, 136], size = [1568, 240] }
