# #282(b) — does Clear actually erase the drawn ring from the canvas? `map-draw-target.toml`'s own
# header used to assert it does not. It does now: the root cause was a #252-shaped compositor gap, not
# a state bug — `MapDraft`/`geo-draft`'s `setData` were both correct, but a draft push reaching the map
# from outside any canvas gesture (Clear's own button, not a `MapLibre` click) never got its scheduled
# frame composited under `WebKitGTK`'s software-GL path, so the ring stayed on screen indefinitely. The
# fix is one `map.redraw()` call in `push_draft_script` (`map_shared.rs`), the same forced-repaint
# pattern the #252 resize observer already uses. See the #282 PR report for how this was diagnosed.
#
# No toast fires in this path (there is a draw target the whole time — nothing here ever finishes with
# none selected), so the Finish/Clear row never shifts under the pointer
# (`map-draw-target.toml`'s own header documents the shift a toast causes). Clear is targeted by its role
# and text, not by its position beside Finish.
description = "Clicking Clear after drawing a polygon erases the ring from the canvas (#282b)"

[[step]]
do = "click"
at = { role = "listitem", text = "Geography" }
label = "rail: Geography"

[[step]]
do = "click"
at = { role = "button", text = "Draw polygon" }
label = "toolbar: Draw polygon"

[[step]]
do = "click"
at = { id = "geography-map", offset = [415, 242] }
label = "map: first vertex"

[[step]]
do = "click"
at = { id = "geography-map", offset = [715, 262] }
label = "map: second vertex"

[[step]]
do = "click"
at = { id = "geography-map", offset = [615, 542] }
label = "map: third vertex"

[[step]]
do = "shot"
name = "ring-closed"

[[step]]
do = "click"
at = { role = "button", text = "Clear" }
label = "Clear"

[[step]]
do = "shot"
name = "cleared"

[[assert]]
kind = "differ"
shots = ["ring-closed", "cleared"]
region = { id = "geography-map", offset = [15, 42], size = [1250, 700] }
because = "Clear must erase the drawn ring from the canvas, not just the draft state"
