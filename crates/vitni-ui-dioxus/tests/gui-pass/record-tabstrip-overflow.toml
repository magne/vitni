# #285's second instance — the record tabstrip, not a detail pane's tab strip.
#
# `.tabstrip .tabs-scroll` carries the same `overflow-x: auto` as `.tabs`, on an even shorter row, so
# it had the same defect: once the strip overflows, `WebKitGTK`'s horizontal scrollbar hit rectangle
# (~20px) covers the lower two thirds of every record tab — the label's own centre and the close `✕`
# with it.
#
# Six tabs overflow the strip at the app's own default 1280x840 window, which is a realistic count:
# one open record plus a create draft per category. `⌘N` adds an `OpenTab::Draft(Category, DraftId)` tab
# without a save, so the tabs cost two steps each instead of a whole create form. One `⌘N` per
# *distinct* category, so every draft here is the first of its own and reads as the create pane's own
# title — "New person", singular, with no ordinal (#260, #308) — which is what keeps the measured tab
# boxes below valid. The singular labels are narrower than the plural rail labels this scenario was
# first measured against, so it still overflows but by less: re-measure, never carry old numbers over.
#
# Measured on this scenario's own `filled` shot: the `.rtab` box paints y 86-119 with the label glyphs
# on 99-107, and `.tabstrip`'s border-bottom on 121. Tab boxes are Kristiansand 608-726, New place
# 731-836, New person 841-957, New family 962-1072, New event 1077-1184, New source 1189-past the
# scroll box's right edge at 1231 — the clip that is the overflow this depends on. The clicks aim at
# New person's painted label centre (889, 103; its glyphs run 855-920), then Kristiansand's (658, 103;
# glyphs 623-694), then Kristiansand's close `✕` (717, 103) — re-measured on `kristiansand-clicked`,
# because `.rtab.active` is `font-weight: 600` and the bolder label pushes its own `✕` right (716-718
# there, against 708-709 while inactive). Without the fix all three sit in the dead band and every
# assertion below fails at RMSE 0.0000.
#
# The `✕` probe closes **Kristiansand**, a saved record, and that choice is load-bearing. Aimed at a
# draft's `✕` it proves nothing: the unsaved-draft "Close tab?" confirm paints over the same pane
# region, so the assertion passes on the modal whether or not the tab ever closes. A saved record's tab
# closes outright, and closing the *active* one moves the pane to another record — a consequence a
# sideways scroll cannot fake.
#
# Every assertion is over the editor pane only, below the tabstrip. A region containing the strip could
# not tell a record switch from the sideways scroll the defect produced instead.
description = "A click at a record tab's painted centre switches records when the tabstrip overflows (#285)"
window = [1280, 840]

[[step]]
do = "click"
at = [85, 283]
label = "rail: Places"

[[step]]
do = "click"
at = [300, 99]
label = "explorer: Kristiansand"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Place draft"

[[step]]
do = "click"
at = [85, 175]
label = "rail: People"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Person draft"

[[step]]
do = "click"
at = [85, 211]
label = "rail: Families"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Family draft"

[[step]]
do = "click"
at = [85, 247]
label = "rail: Events"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Event draft"

[[step]]
do = "click"
at = [85, 319]
label = "rail: Sources"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Source draft — six tabs, past the strip's width"

[[step]]
do = "shot"
name = "filled"

[[step]]
do = "click"
at = [889, 103]
label = "record tab: New person, at the painted label's centre"

[[step]]
do = "shot"
name = "people-clicked"

[[step]]
do = "click"
at = [658, 103]
label = "record tab: Kristiansand, at the painted label's centre"

[[step]]
do = "shot"
name = "kristiansand-clicked"

[[step]]
do = "click"
at = [717, 103]
label = "record tab: Kristiansand's close ✕, at its painted centre"

[[step]]
do = "shot"
name = "kristiansand-closed"

[[assert]]
kind = "differ"
shots = ["filled", "people-clicked"]
region = [532, 130, 748, 600]
tolerance = 0.02
because = "clicking a record tab's painted label must switch records, not scroll the tabstrip (#285)"

[[assert]]
kind = "differ"
shots = ["people-clicked", "kristiansand-clicked"]
region = [532, 130, 748, 600]
tolerance = 0.02
because = "a second tab's painted label, to prove the first hit was not a one-off"

[[assert]]
kind = "differ"
shots = ["kristiansand-clicked", "kristiansand-closed"]
region = [532, 130, 748, 600]
tolerance = 0.02
because = "the close ✕ sits in the same dead band as the label — closing the active record's tab must move the pane to another record (#285)"
