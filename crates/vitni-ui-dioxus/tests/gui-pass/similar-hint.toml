# #415: typing a stored person's name and birth year into a new person raises the similar-record
# hint, without blocking: Compare opens the draft beside the stored record, Save still creates the new
# one, Find similar on it lists the stored record and its Compare opens the pair in the Matches tool,
# and Use existing on a later draft drops it for the stored record. SSR renders the hint's markup but
# cannot run the lookup behind it — the resource that reruns as the draft changes.
#
# The fixture seeds no persons (and must not), so the scenario creates Guldbrand Olsen, born 1852,
# first. After a Save the record leaves edit mode, so the next draft comes from the tabstrip's "+".
#
# Every assertion is scoped to the region the step should change: the hint's band under the Overview
# card, the compare below it, the side panel, the Matches view, and the tabstrip.
description = "Typing a stored person's name and birth year raises the similar-record hint (#415)"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Person draft"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "Guldbrand"
label = "type: Guldbrand"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Olsen"
label = "type: Olsen"

[[step]]
do = "click"
at = { id = "born" }
label = "field: Born"

[[step]]
do = "text"
text = "1852"
label = "type: 1852"

[[step]]
do = "click"
at = { role = "button", text = "Save" }
label = "New person: Save"

[[step]]
do = "shot"
name = "saved"

[[step]]
do = "click"
at = { role = "button", text = "Create a new record" }
label = "tabstrip: +"

[[step]]
do = "click"
at = { role = "menuitem", text = "New person" }
label = "menu: New person"

[[step]]
do = "shot"
name = "blank"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "Gulbrand"
label = "type: Gulbrand"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Olsen"
label = "type: Olsen"

[[step]]
do = "click"
at = { id = "born" }
label = "field: Born"

[[step]]
do = "text"
text = "1852"
label = "type: 1852"

[[step]]
do = "shot"
name = "hint"

[[step]]
do = "click"
at = { role = "button", text = "Compare" }
label = "hint: Compare"

[[step]]
do = "shot"
name = "compare"

[[step]]
do = "click"
at = { role = "button", text = "Save" }
label = "New person: Save, past the hint"

[[step]]
do = "shot"
name = "saved-anyway"

[[step]]
do = "click"
at = { role = "button", text = "Find similar" }
label = "header: Find similar"

[[step]]
do = "shot"
name = "find-similar"

[[step]]
do = "click"
at = { role = "button", text = "Compare" }
label = "Find similar: Compare"

[[step]]
do = "shot"
name = "matches"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People"

[[step]]
do = "click"
at = { hook = "explorer", offset = [148, 573] }
label = "empty list space"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Person draft"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "Guldbrand"
label = "type: Guldbrand"

[[step]]
do = "click"
at = { id = "surname" }
label = "field: Surname"

[[step]]
do = "text"
text = "Olsen"
label = "type: Olsen"

[[step]]
do = "shot"
name = "hint-two"

[[step]]
do = "click"
at = { role = "button", text = "Use existing", index = 0 }
label = "hint: Use existing on Guldbrand Olsen"

[[step]]
do = "shot"
name = "used"

[[assert]]
kind = "differ"
shots = ["blank", "hint"]
because = "a stored person's name and birth year must raise the hint under the Overview card"
region = { hook = "record-pane", offset = [20, 703], size = [1228, 60] }

[[assert]]
kind = "differ"
shots = ["hint", "compare"]
because = "Compare must open the draft beside the stored record, inside the hint"
region = { hook = "record-pane", offset = [20, 757], size = [1228, 290] }

[[assert]]
kind = "differ"
shots = ["saved-anyway", "find-similar"]
because = "Find similar must open its panel listing the stored record"
region = { role = "main", offset = [888, -3], size = [380, 1050] }

[[assert]]
kind = "differ"
shots = ["find-similar", "matches"]
because = "the panel's Compare must open the pair in the Matches tool's compare view"
region = { role = "main", offset = [0, -3], size = [1268, 600] }

[[assert]]
kind = "differ"
shots = ["hint-two", "used"]
because = "Use existing must drop the draft's tab for the stored record's"
region = { hook = "record-tabs", offset = [0, 5], size = [1268, 45] }
