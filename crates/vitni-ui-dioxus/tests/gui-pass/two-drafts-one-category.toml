# #260: several unsaved new records of one category, side by side. Three things here are invisible to
# SSR, which renders markup and moves no focus.
#
# 1. **The remount.** `screens/record_detail.rs` keys the create pane on the draft's own `EditKey`, so a
#    second `⌘N` builds a *fresh* form rather than reusing the first draft's component instance. SSR
#    cannot see component reuse at all; here the second draft's empty form is the proof.
# 2. **Where the caret goes.** The second `⌘N` destroys the input the caret was in. Before
#    `CreateFormFocus` focus fell to `<body>`, and the next keystroke reached the *shell* dispatcher
#    instead of the new form — which is why typing into draft 2 is asserted over the form region while
#    the tabstrip's **history controls** are asserted *unchanged*: an overlay opening instead (`?` is one
#    keystroke away there) would repaint both. The controls rather than the whole strip, because since
#    #307 the first keystroke into a draft also raises its tab's `●` — a change inside the tabs that says
#    nothing about which element took the key.
# 3. **The live buffers.** Each tab must come back to its own text, from the shell's parked buffer, after
#    its pane has been unmounted and rebuilt.
#
# People, not Tags: Tags' create form is the one that already autofocused its first field, so it could
# not tell a working focus hand-off from the pre-existing one.
#
# The caret is a real pixel and its position is not, so every `match` reference is taken with the caret
# parked in the **ID** field, empty — which is exactly where a remounted create form autofocuses it. A
# reference taken with the caret in Given name would compare a ring in one field against a ring in
# another. The `I` typed into draft 2's ID is backspaced away again for the same reason.
#
# The Given-name `differ` region starts past the person card's label column rather than at the field's
# left edge: the label ink is identical in both frames, so including it would only dilute the three
# glyphs the assertion is about.
#
# The two draft tabs are targeted by role and text ("Ada", "Bob"), resolved when each click runs,
# because a draft tab resizes as it is typed into — the text changes and the `●` appears — so where a
# tab sat before typing is not where it sits after.
description = "A second ⌘N opens another draft of one category, with its own form, caret and buffer (#260)"

[[step]]
do = "click"
at = { role = "listitem", text = "People" }
label = "rail: People"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: the first Person draft"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "Ada"
label = "type: Ada — draft 1 names itself Ada"

[[step]]
do = "click"
at = { id = "human-id" }
label = "field: ID — park the caret where a remount would autofocus it"

[[step]]
do = "shot"
name = "one-parked"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name again — the caret is in a field the next ⌘N destroys"

[[step]]
do = "shot"
name = "one-typed"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a second Person draft, from inside draft 1's Given name"

[[step]]
do = "shot"
name = "two-fresh"

[[step]]
do = "key"
chord = "shift+i"
label = "type: I — into whatever the fresh form focused (its ID)"

[[step]]
do = "shot"
name = "two-id"

[[step]]
do = "key"
chord = "BackSpace"
label = "clear it again, so the ID is empty for the reference frames below"

[[step]]
do = "click"
at = { id = "given" }
label = "field: Given name"

[[step]]
do = "text"
text = "Bob"
label = "type: Bob — draft 2 names itself Bob"

[[step]]
do = "shot"
name = "two-typed"

[[step]]
do = "click"
at = { id = "human-id" }
label = "field: ID — park the caret for the reference frame"

[[step]]
do = "shot"
name = "two-parked"

[[step]]
do = "click"
at = { role = "tab", text = "Ada" }
label = "record tab: draft 1 (Ada), on its label — not the ✕ four glyphs to the right"

[[step]]
do = "shot"
name = "back-to-one"

[[step]]
do = "click"
at = { role = "tab", text = "Bob" }
label = "record tab: draft 2 (Bob), on its label"

[[step]]
do = "shot"
name = "back-to-two"

[[assert]]
kind = "differ"
shots = ["one-typed", "two-fresh"]
region = { hook = "record-pane" }
because = "a second ⌘N must build a fresh, empty form — a reused component instance would still show draft 1's text (#260)"

[[assert]]
kind = "differ"
shots = ["two-fresh", "two-id"]
region = { hook = "record-pane" }
because = "the caret must be inside the new form, or the keystroke reaches the shell dispatcher instead"

[[assert]]
kind = "match"
shots = ["two-fresh", "two-id"]
# The strip's ‹ › history controls, left of the first tab — the part of the shell chrome the
# keystroke may not touch. The tabs themselves are excluded on purpose: the key lands in draft 2's ID,
# which marks that draft unsaved and paints its `●` (#307).
region = { role = "button", text = "Back", offset = [-12, -8], size = [78, 45] }
# Byte-identical when it works (RMSE 0.0000): a field took the keystroke, so no shell chrome repainted.
# An overlay opening instead — `?` is one keystroke away from an unfocused shell — paints over the whole
# strip, controls included, and the `differ` above alone could not tell the two apart.
tolerance = 0.001
because = "and it must be a *field* that took it, not the shell — an overlay would repaint the strip's controls too"

[[assert]]
kind = "differ"
shots = ["two-id", "two-typed"]
region = { hook = "record-tabs", offset = [0, 5], size = [1268, 45] }
because = "typing a name into a draft renames its own tab, live (#260)"

[[assert]]
kind = "match"
shots = ["one-parked", "back-to-one"]
region = { hook = "record-pane" }
# RMSE 0.0019 — the residue is the remount's own repaint (the per-field reset ↺ on the restored,
# modified input), not the text: over the Given name field alone the two frames are identical.
because = "returning to draft 1 must restore draft 1's own buffer, from the shell, after its pane was torn down"

[[assert]]
kind = "match"
shots = ["two-parked", "back-to-two"]
region = { hook = "record-pane" }
because = "and returning to draft 2 must restore draft 2's, not the one it was rebuilt beside"

[[assert]]
kind = "differ"
shots = ["back-to-one", "back-to-two"]
# The Given name input alone. Three glyphs are 0.0044 of the whole form pane — under any tolerance that
# would still call the two restore frames above a match — and 0.0521 of the field they sit in.
region = { hook = "record-pane", offset = [128, 348], size = [300, 32] }
because = "the two restored forms must not be the same form — one buffer shared between the drafts is the defect (#260)"
