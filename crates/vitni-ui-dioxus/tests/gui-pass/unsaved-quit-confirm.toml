# The other half of #244: the quit confirm, and the state where Save is *blocked*. The draft is typed
# into — a latitude with no longitude, which is the one edit that makes a `PlaceDraft` hold unsaved work
# and still fail its own Save gate (`view_model/place.rs`: a half-filled coordinate pair is
# `Coordinates::Invalid`). So the confirm renders its Save disabled with the reason under the body — and
# a disabled button is not a tab stop, which turns the usual three-button ring into a two-button one.
# That is the sharpest thing a screenshot can say about the footer, so it is what this scenario asserts.
# A draft nobody had typed into would not raise the dialog at all since #307, which is `draft-close-confirm`.
#
# `⌘Q` then raises the quit confirm over two unsaved tabs (the unsavable draft and a dirtied
# Kristiansand), which is the only way to see the `ul.stack` list of records at stake under WebKitGTK.
# Its **Save all** is live even though the draft cannot be saved (#261), so the run is clicked here:
# it saves Kristiansand, leaves the draft open, and does *not* quit — which is what makes the click
# screenshottable at all. The window still standing in `after-save-all` is half the assertion; the other
# half is the tabstrip, where Kristiansand's `●` is gone and the draft's is not.
#
# Discard all is still deliberately never clicked: it quits, and the next screenshot would find no
# window. That a *complete* `⌘Q` Save-all run reaches `QuitManager` only after the last save lands stays
# a human check, as does whether the saves *look* instant.
#
# The click on empty list space before the second `⌘Q` is not cosmetic: dismissing a modal with `Esc`
# leaves nothing in the webview focused, and a chord that reaches no focused element reaches no
# dispatcher either.
#
# Coordinates are window pixels at 1800x1200, read off the shots this scenario writes.
description = "The quit confirm lists both unsaved tabs, and a partial Save all keeps the app up (#244, #261)"

[[step]]
do = "click"
at = [85, 283]
label = "rail: Places"

[[step]]
do = "key"
chord = "ctrl+n"
label = "⌘N: a new Place draft"

[[step]]
do = "click"
at = [1150, 495]
label = "field: Latitude"

[[step]]
do = "key"
chord = "5"
label = "type: 5"

[[step]]
do = "key"
chord = "9"
label = "type: 9 — a latitude with no longitude: unsaved work that cannot be saved"

[[step]]
do = "shot"
name = "draft-open"

[[step]]
do = "key"
chord = "ctrl+w"
label = "⌘W on the draft, which holds work Save cannot take"

[[step]]
do = "shot"
name = "blocked-confirm"

[[step]]
do = "key"
chord = "Tab"
label = "confirm: Tab onto Discard draft"

[[step]]
do = "shot"
name = "ring-discard"

[[step]]
do = "key"
chord = "Tab"
label = "confirm: Tab onto the trailing guard, which wraps to Cancel"

[[step]]
do = "key"
chord = "Tab"
label = "confirm: Tab back onto Discard draft"

[[step]]
do = "shot"
name = "ring-cycled"

[[step]]
do = "key"
chord = "Escape"
label = "confirm: Esc"

[[step]]
do = "click"
at = [300, 99]
label = "explorer: Kristiansand, in a second tab"

[[step]]
do = "click"
at = [1740, 145]
label = "detail head: Edit"

[[step]]
do = "click"
at = [1150, 438]
label = "field: ID input"

[[step]]
do = "key"
chord = "Tab"
label = "Tab onto the Type select"

[[step]]
do = "key"
chord = "Down"
label = "Type: Municipality → Parish"

[[step]]
do = "click"
at = [300, 1100]
label = "park the pointer on empty list space"

[[step]]
do = "shot"
name = "two-dirty"

[[step]]
do = "key"
chord = "ctrl+q"
label = "⌘Q with two tabs unsaved"

[[step]]
do = "shot"
name = "quit-confirm"

[[step]]
do = "key"
chord = "Escape"
label = "quit confirm: Esc"

[[step]]
do = "shot"
name = "after-esc"

[[step]]
do = "click"
at = [300, 1100]
label = "empty list space: put keyboard focus back in the app after Esc"

[[step]]
do = "key"
chord = "ctrl+q"
label = "⌘Q again, this time to run Save all"

[[step]]
do = "shot"
name = "quit-confirm-2"

[[step]]
do = "click"
at = [1061, 473]
label = "quit confirm: Save all"

[[step]]
do = "shot"
name = "after-save-all"

[[assert]]
kind = "differ"
shots = ["draft-open", "blocked-confirm"]
because = "⌘W on a draft tab must raise the close confirm"

[[assert]]
kind = "match"
shots = ["ring-discard", "ring-cycled"]
tolerance = 0.001
because = "a blocked Save is not a tab stop, so two Tabs complete the confirm's ring"

[[assert]]
kind = "differ"
shots = ["two-dirty", "quit-confirm"]
because = "⌘Q with unsaved work must raise the quit confirm listing the records at stake"

[[assert]]
kind = "match"
shots = ["two-dirty", "after-esc"]
tolerance = 0.001
because = "Esc must cancel the quit and leave both tabs open"

[[assert]]
kind = "match"
shots = ["quit-confirm", "quit-confirm-2"]
tolerance = 0.001
# Without this the differ below passes on a dialog that never opened, which is how the first draft of
# this scenario "passed": after Esc nothing in the webview holds focus, so the second ⌘Q went nowhere.
because = "the second ⌘Q must raise the same dialog, or the Save all click lands on the pane behind it"

[[assert]]
kind = "differ"
shots = ["quit-confirm-2", "after-save-all"]
because = "Save all must dismiss the dialog and leave the app running — a quit here would lose the window this shot needs"

[[assert]]
kind = "differ"
# Kristiansand's tab alone; the rest of the window repaints on any save, which would fake this.
region = [728, 85, 155, 40]
shots = ["two-dirty", "after-save-all"]
because = "the record Save all could save loses its unsaved marker"

[[assert]]
kind = "match"
# The draft's tab alone, in the same frame.
region = [588, 85, 135, 40]
shots = ["two-dirty", "after-save-all"]
tolerance = 0.001
because = "the record it could not save is left open, still marked unsaved — not saved, and not discarded"
