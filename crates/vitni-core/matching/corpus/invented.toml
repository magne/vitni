# Each pair is two person records and a label: `same` (one individual) or `distinct`. A `same` pair
# may name the `hard` case it exercises (`spelling-variant`, `surname-after-move`, `census-age`,
# `baptism-for-birth`); the gate fails if any of those stops surfacing at `possible` or better. A
# vital event's `basis = "age"` marks a birth year computed from a census age.

