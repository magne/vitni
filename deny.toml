# cargo-deny configuration. Run `cargo deny check`.

[advisories]
version = 2
# Fail on security advisories and unmaintained crates.
ignore = [
    # Unmaintained (NOT vulnerable) transitive dependencies of the Dioxus desktop renderer
    # (`vitni-ui-dioxus`, ADR 0008): wry/tao pull the gtk-rs GTK3 bindings, which are the
    # only GTK3 path on Linux, plus a few unmaintained macro/util crates in the GUI tree.
    # There is no maintained alternative while the desktop renderer targets GTK3; re-evaluate
    # when Dioxus moves off GTK3 (its native Blitz renderer) or these crates are replaced.
    "RUSTSEC-2024-0370", # proc-macro-error (unmaintained)
    # gtk-rs GTK3 bindings family (atk/gdk/gdkx11/gtk + their -sys/-macros crates).
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0436", # paste (unmaintained)
    "RUSTSEC-2025-0057", # fxhash (unmaintained)
    # zvariant and its zbus_names/zvariant_derive companions (unmaintained, NOT vulnerable: merged
    # into zbus 6 as its `wire` module). Pulled by zbus 5 through `dark-light` 3.0.0, the leaf crate
    # `vitni-ui-dioxus` uses for System theme detection over D-Bus; its latest release requires
    # zbus ^5.19, so there is no upgrade. Re-evaluate when `dark-light` moves to zbus 6 or is replaced.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
    # basic-toml (unmaintained, NOT vulnerable): pulled by i18n-config 0.4.8 under i18n-embed(-fl), which
    # has no release off it. Re-evaluate when i18n-config drops it.
    "RUSTSEC-2026-0374", # basic-toml
    # webpki-roots 0.26.11 (NOT vulnerable here): a shim that re-exports webpki-roots 1.x, locked at
    # 1.0.10, which drops the distrusted emSign root. sqlx-core 0.8.6 still requires ^0.26, so the
    # advisory matches the shim's version only. Re-evaluate when sqlx moves to webpki-roots 1.
    "RUSTSEC-2026-0381", # webpki-roots 0.26.11 shim
]

[licenses]
version = 2
# Permissive licenses acceptable for this project's dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # OSI-approved, FSF-libre, permissive (BSD-style). Required by `libfuzzer-sys`
    # (`(MIT OR Apache-2.0) AND NCSA`), pulled via image → ravif → rav1e in the Dioxus tree.
    "NCSA",
]
confidence-threshold = 0.9

# This workspace's own application crates are AGPL-3.0-or-later (ADR 0034 §1). They are listed one
# by one rather than added to `allow` on purpose: `allow` would also let an AGPL *dependency*
# through, and the project can only ship copyleft it owns. A new AGPL crate here is a deliberate
# edit; a new AGPL dependency still fails.
[[licenses.exceptions]]
name = "vitni-core"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "vitni-db"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "vitni-app"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "vitni-plugin-host"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "vitni-ui"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "vitni-ui-dioxus"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "vitni-cli"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "vitni"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "vitni-digitalarkivet"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "xtask"
allow = ["AGPL-3.0-or-later"]

[bans]
# Warn on duplicate versions of the same crate; allow otherwise.
multiple-versions = "warn"

[sources]
# Only crates.io is trusted.
unknown-registry = "deny"
unknown-git = "deny"
