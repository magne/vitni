# cargo-deny configuration. Run `cargo deny check`.

[advisories]
version = 2
# Fail on security advisories and unmaintained crates.
ignore = [
    # Unmaintained (NOT vulnerable) transitive dependencies of the Dioxus desktop renderer
    # (`vitni-ui-dioxus`, ADR 0008): wry/tao pull the gtk-rs GTK3 bindings, which are the
    # only GTK3 path on Linux, plus a few unmaintained macro/util crates in the GUI tree.
    # There is no maintained alternative while the desktop renderer targets GTK3; re-evaluate
    # when Dioxus moves off GTK3 (its native Blitz renderer) or these crates are replaced.
    "RUSTSEC-2024-0370", # proc-macro-error (unmaintained)
    # gtk-rs GTK3 bindings family (atk/gdk/gdkx11/gtk + their -sys/-macros crates).
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0436", # paste (unmaintained)
    "RUSTSEC-2025-0057", # fxhash (unmaintained)
    # async-std (discontinued, NOT vulnerable). Pulled by `dark-light` 2.0.0, the leaf crate
    # `vitni-ui-dioxus` uses for System theme detection; on Linux it hardcodes the
    # `ashpd`/async-std path with no feature to swap and no maintained upgrade. Re-evaluate when
    # `dark-light` migrates off async-std or is replaced.
    "RUSTSEC-2025-0052", # async-std (discontinued)
]

[licenses]
version = 2
# Permissive licenses acceptable for this project's dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # OSI-approved, FSF-libre, permissive (BSD-style). Required by `libfuzzer-sys`
    # (`(MIT OR Apache-2.0) AND NCSA`), pulled via image → ravif → rav1e in the Dioxus tree.
    "NCSA",
]
confidence-threshold = 0.9

[bans]
# Warn on duplicate versions of the same crate; allow otherwise.
multiple-versions = "warn"

[sources]
# Only crates.io is trusted.
unknown-registry = "deny"
unknown-git = "deny"
