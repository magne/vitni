# cargo-deny configuration. Run `cargo deny check`.

[advisories]
version = 2
# Fail on security advisories and unmaintained crates; nothing ignored.
ignore = []

[licenses]
version = 2
# Permissive licenses acceptable for this project's dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Warn on duplicate versions of the same crate; allow otherwise.
multiple-versions = "warn"

[sources]
# Only crates.io is trusted.
unknown-registry = "deny"
unknown-git = "deny"
