[package]
name = "genealogy-gedcom-export"
version = "0.1.0"
edition = "2024"
publish = false

# GEDCOM export plugin component (ADR 0007, ADR 0011). Thin wasm glue: reads via the host `query`
# capability and serializes with `genealogy-gedcom`. Built for `wasm32-wasip2` via
# `cargo xtask build-plugins`; excluded from the workspace.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57.1"
genealogy-plugin-api = { path = "../plugin-api" }
genealogy-gedcom = { path = "../../crates/genealogy-gedcom" }

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
