[package]
name = "vitni-gramps-export"
version = "0.1.0"
edition = "2024"
# commodity interop (ADR 0034 §1). Outside the workspace, so nothing is inherited.
license = "MIT OR Apache-2.0"
publish = false

# Gramps XML export plugin component (ADR 0013, ADR 0018). Thin wasm glue: reads via the host
# `query` capability and serializes with `vitni-gramps-xml`. Built for `wasm32-wasip2` via
# `cargo xtask build-plugins`; excluded from the workspace.

[lib]
crate-type = ["cdylib"]

# ADR 0014 §2 bundle manifest (see `build-plugins`): declared role and capability requests.
[package.metadata.vitni-plugin]
role = "bulk-export"
host_api = "0.22.0"
capabilities = ["log", "query", "progress", "export-sink"]

[dependencies]
wit-bindgen = "0.57.1"
vitni-plugin-api = { path = "../plugin-api" }
vitni-gramps-xml = { path = "../../crates/vitni-gramps-xml" }
vitni-interchange = { path = "../../crates/vitni-interchange" }

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
