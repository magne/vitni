[package]
name = "genealogy-gramps-import"
version = "0.1.0"
edition = "2024"
publish = false

# Gramps XML import plugin component (ADR 0007, ADR 0011, ADR 0018). Thin wasm glue: parses with
# `genealogy-gramps-xml` and drives the host `commands` capability. Built for `wasm32-wasip2` via
# `cargo xtask build-plugins`; excluded from the workspace.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57.1"
genealogy-plugin-api = { path = "../plugin-api" }
genealogy-gramps-xml = { path = "../../crates/genealogy-gramps-xml" }
genealogy-interchange = { path = "../../crates/genealogy-interchange" }

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
