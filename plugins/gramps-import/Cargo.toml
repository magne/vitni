[package]
name = "vitni-gramps-import"
version = "0.1.0"
edition = "2024"
publish = false

# Gramps XML import plugin component (ADR 0007, ADR 0011, ADR 0018). Thin wasm glue: parses with
# `vitni-gramps-xml` and drives the host `commands` capability. Built for `wasm32-wasip2` via
# `cargo xtask build-plugins`; excluded from the workspace.

[lib]
crate-type = ["cdylib"]

# ADR 0014 §2 bundle manifest (see `build-plugins`): declared role and capability requests.
[package.metadata.vitni-plugin]
role = "bulk-import"
host_api = "0.22.0"
capabilities = ["log", "commands", "progress", "import-source"]

[dependencies]
wit-bindgen = "0.57.1"
vitni-plugin-api = { path = "../plugin-api" }
vitni-gramps-xml = { path = "../../crates/vitni-gramps-xml" }
vitni-interchange = { path = "../../crates/vitni-interchange" }

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
