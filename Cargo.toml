[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/genealogy-cli"]
# WASM plugin components build only for `wasm32-wasip2` and use `wit-bindgen` guest
# macros, so they cannot build for the host target alongside the native crates.
# They are standalone packages built via `cargo xtask build-plugins` (ADR 0011).
exclude = ["plugins"]

# Cranelift compiles every wasm plugin component at load time; under the dev profile it
# would otherwise run unoptimized, which dominates `genealogy-plugin-host` test time.
# Optimizing just the compiler crates makes each compile fast at a small one-time,
# cached, build cost — no effect on emitted code.
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

# Shared package metadata. Member crates inherit with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/magne/genealogy"

# Shared dependencies. Member crates inherit with `dep.workspace = true`.
# Versions are populated by `cargo add` (current stable at implementation time).
[workspace.dependencies]
# domain / shared
cqrs-es = "0.5.0"
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["v7", "serde"] }
thiserror = "2.0.18"
time = { version = "0.3.44", features = ["serde", "serde-well-known", "macros"] }
sqlx = { version = "0.8.6", features = ["sqlite", "postgres", "runtime-tokio", "json"] }
tracing = "0.1.41"
# event-store backends (genealogy-db, feature-gated)
sqlite-es = "0.5.0"
postgres-es = "0.5.0"
# plugin host (genealogy-plugin-host; ADR 0007, 0011)
wasmtime = "46.0.1"
wasmtime-wasi = "46.0.1"
# assisted-import host capabilities (genealogy-plugin-host; ADR 0017): host-mediated HTTP,
# media-library storage with SHA-256 checksums, and content-type sniffing.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip", "stream", "json"] }
sha2 = "0.11.0"
mime_guess = "2.0.5"
# base64-encodes the media file into the OpenAI-compatible vision request (ADR 0017 §4).
base64 = "0.22.1"
wiremock = "0.6.5"
# scoped environment-variable guard for the ai vision-api key tests (ADR 0017 §4); serializes env
# mutation so parallel tests don't race the process environment.
temp-env = { version = "0.3.6", features = ["async_closure"] }
# async runtime / test support
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tempfile = "3.24.0"
# framework-free boundary guard (genealogy-ui dev-only; ADR 0008 dependency-tree assertion)
cargo_metadata = "0.23.1"
# property-based tests for the pure crop/media-naming view-model math (genealogy-ui dev-only; ADR 0017)
proptest = "1.8.0"
# application layer (config, workspace lifecycle, use-cases)
figment = { version = "0.10.19", features = ["toml", "env"] }
directories = "6.0.0"
whoami = "2.1.2"
toml = "1.1.2"
# import/export formats (genealogy-gedcom, genealogy-gramps-xml; plugins)
quick-xml = "0.41.0"
# Digitalarkivet HTML parsing (genealogy-digitalarkivet; ADR 0017). Pure CSS-selector scraping
# plus WHATWG URL parsing for host checks and base-relative link resolution;
# both verified to build for wasm32-wasip2 (the plugin target).
scraper = "0.27.0"
url = "2.5.8"
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
# cli frontend
clap = { version = "4.6.1", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.103"
# localization (genealogy-cli; ADR 0003)
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester", "filesystem-assets"] }
i18n-embed-fl = "0.10.0"
rust-embed = "8.11.0"
unic-langid = "0.9.6"
# localized date/number formatting (genealogy-cli; ICU 2.x, compiled CLDR data — roadmap Spike A)
icu = "2.2.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
# ui renderer (genealogy-ui-dioxus; ADR 0008). The desktop renderer is opted into per-crate via a
# `desktop` feature, so default builds (and the SSR interpreter test) need no webview system libs.
dioxus = "0.7.8"
dioxus-ssr = "0.7.8"
# OS appearance detection for the "System" theme mode (genealogy-ui-dioxus, desktop only)
dark-light = "2.0.0"
# internal crates
genealogy-interchange = { path = "crates/genealogy-interchange" }
genealogy-core = { path = "crates/genealogy-core" }
genealogy-i18n = { path = "crates/genealogy-i18n" }
genealogy-db = { path = "crates/genealogy-db", default-features = false }
genealogy-app = { path = "crates/genealogy-app" }
genealogy-ui = { path = "crates/genealogy-ui" }
genealogy-plugin-host = { path = "crates/genealogy-plugin-host" }

# Workspace-wide lints (copied from ~/.claude/templates/Cargo-lints.toml).
# Member crates opt in with `[lints] workspace = true`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
# No cheating
allow_attributes = "deny"
# Code hygiene
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Safety
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"
# The DAO layer is dozens of one-line CRUD fns that all return the same
# `DbError`; a per-fn `# Errors` paragraph would be pure noise, not information.
missing_errors_doc = "allow"
