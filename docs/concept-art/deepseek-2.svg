<svg xmlns="http://www.w3.org/2000/svg" width="640" height="128" viewBox="0 0 640 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2d42"/>
      <stop offset="100%" stop-color="#1a1c2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8c630"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>

  <!-- 256px (leftmost) -->
  <g transform="translate(8,8)">
    <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bg)" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="128" cy="116" r="44" fill="none" stroke="url(#gold)" stroke-width="14"/>
    <circle cx="128" cy="116" r="14" fill="#f8c630"/>
    <circle cx="128" cy="116" r="6" fill="#2b2d42"/>
    <line x1="80" y1="160" x2="175" y2="65" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="100" cy="190" r="8" fill="#f8c630" opacity="0.7"/>
    <circle cx="128" cy="196" r="10" fill="#f8c630"/>
    <circle cx="156" cy="190" r="8" fill="#f8c630" opacity="0.7"/>
    <path d="M 70 210 Q 128 230 186 210" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.5"/>
  </g>

  <!-- 128px -->
  <g transform="translate(280,28)">
    <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bg)" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="64" cy="58" r="22" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <circle cx="64" cy="58" r="7" fill="#f8c630"/>
    <circle cx="64" cy="58" r="3" fill="#2b2d42"/>
    <line x1="40" y1="80" x2="88" y2="32" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="50" cy="95" r="5" fill="#f8c630" opacity="0.7"/>
    <circle cx="64" cy="98" r="6" fill="#f8c630"/>
    <circle cx="78" cy="95" r="5" fill="#f8c630" opacity="0.7"/>
    <path d="M 35 105 Q 64 115 93 105" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- 64px -->
  <g transform="translate(424,44)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#bg)" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="32" cy="29" r="11" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <circle cx="32" cy="29" r="3.5" fill="#f8c630"/>
    <circle cx="32" cy="29" r="1.5" fill="#2b2d42"/>
    <line x1="20" y1="40" x2="44" y2="16" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="25" cy="47.5" r="2.5" fill="#f8c630" opacity="0.7"/>
    <circle cx="32" cy="49" r="3" fill="#f8c630"/>
    <circle cx="39" cy="47.5" r="2.5" fill="#f8c630" opacity="0.7"/>
    <path d="M 18 52.5 Q 32 57.5 46 52.5" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- 48px -->
  <g transform="translate(504,52)">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="url(#bg)" stroke="url(#gold)" stroke-width="4"/>
    <circle cx="24" cy="22" r="8" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="24" cy="22" r="2.5" fill="#f8c630"/>
    <circle cx="24" cy="22" r="1" fill="#2b2d42"/>
    <line x1="15" y1="30" x2="33" y2="12" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="19" cy="35.5" r="2" fill="#f8c630" opacity="0.7"/>
    <circle cx="24" cy="37" r="2.5" fill="#f8c630"/>
    <circle cx="29" cy="35.5" r="2" fill="#f8c630" opacity="0.7"/>
  </g>

  <!-- 32px -->
  <g transform="translate(568,56)">
    <rect x="0" y="0" width="32" height="32" rx="6" fill="url(#bg)" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="16" cy="14" r="5" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <circle cx="16" cy="14" r="1.5" fill="#f8c630"/>
    <line x1="10" y1="20" x2="22" y2="8" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="13" cy="23" r="1.5" fill="#f8c630" opacity="0.7"/>
    <circle cx="16" cy="24" r="2" fill="#f8c630"/>
    <circle cx="19" cy="23" r="1.5" fill="#f8c630" opacity="0.7"/>
  </g>

  <!-- 24px + 16px grouped together (rightmost) -->
  <!-- 24px -->
  <g transform="translate(616,60)">
    <rect x="0" y="0" width="24" height="24" rx="5" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="12" cy="10.5" r="4" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="12" cy="10.5" r="1.2" fill="#f8c630"/>
    <line x1="7.5" y1="15" x2="16.5" y2="6" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="10" cy="17.5" r="1.2" fill="#f8c630" opacity="0.7"/>
    <circle cx="12" cy="18.5" r="1.5" fill="#f8c630"/>
    <circle cx="14" cy="17.5" r="1.2" fill="#f8c630" opacity="0.7"/>
  </g>

  <!-- 16px -->
  <g transform="translate(616,84)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="url(#bg)" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="8" cy="7" r="2.5" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="8" cy="7" r="0.8" fill="#f8c630"/>
    <line x1="5" y1="10" x2="11" y2="4" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <!-- Three dots simplified to a single dot at 16px (otherwise they merge) -->
    <circle cx="8" cy="12" r="1.2" fill="#f8c630"/>
  </g>
</svg>
