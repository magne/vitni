name: CI

on:
  push:
    branches: [main]
    # Skip the lint/test cycle when a push touches only documentation. CI still runs if any
    # non-doc file changes (paths-ignore triggers only when every changed path is ignored).
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable, pinned 2026-06-19
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The genealogy-ui-dioxus desktop renderer (ADR 0008) links a system webview (wry/tao). The
      # `--all-features` clippy/test steps below enable its `desktop` feature, so the webview dev
      # libraries must be present.
      - name: webview system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: build plugin components
        run: cargo xtask build-plugins
      # The `--all-features` test step enables the postgres backend, whose integration tests start a
      # Postgres container via `test-containers-util`. ubuntu-latest ships a running Docker daemon,
      # so no service container is needed; pre-pulling the image keeps the first test from racing the
      # pull. The helper isolates each test in its own database, so no cross-run container reuse.
      - name: pre-pull postgres image
        run: docker pull postgres:18-alpine
      - name: test
        run: cargo test --workspace --all-features --all-targets
      - name: doctests
        run: cargo test --workspace --all-features --doc
      - name: i18n completeness
        run: cargo xtask i18n-check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check
