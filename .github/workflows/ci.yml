name: CI

on:
  push:
    branches: [main]
    # Skip the lint/test cycle when a push touches only documentation. CI still runs if any
    # non-doc file changes (paths-ignore triggers only when every changed path is ignored).
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `check` was one job, but clippy (check profile) and nextest (test profile) produce two distinct
  # artifact sets that stacked in a single `target/` on one runner, exhausting its disk (os error 28).
  # Splitting the flavors onto separate runners keeps `--all-features --all-targets` coverage while
  # halving peak disk per runner. rust-cache keys per job, so each caches only its own flavor.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    # Runs inside the custom image (see .github/docker/ci.Dockerfile, published by ci-image.yml),
    # which bakes the webview dev libs, the pinned stable toolchain + wasm32-wasip2 target +
    # components, and cargo-nextest. `packages: read` lets the runner pull the private GHCR image.
    permissions:
      contents: read
      packages: read
    container:
      # Pin to `ghcr.io/magne/genealogy-ci@sha256:...` once ci-image.yml has published the image;
      # the digest does not exist until the first push.
      image: ghcr.io/magne/genealogy-ci:latest # zizmor: ignore[unpinned-images]
    # Dropping debuginfo for the dev/test profiles slashes object size and linker memory (the heavy
    # tree — dioxus-desktop, wasmtime, icu, postgres dev-deps — otherwise ran the linker out of
    # memory). Safe across targets (unlike a `-fuse-ld` RUSTFLAG, which would break the wasm32 build).
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # rust-cache alone (no sccache: it would double-cache the same artifacts against the shared
      # 10 GB GHA backend). One stable toolchain and the default `./target` are all that need caching;
      # the plugin `plugins/*/target` dirs are small wasm builds, intentionally left uncached.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: static checks (i18n, css, input-guard)
        run: cargo xtask check

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/magne/genealogy-ci:latest # zizmor: ignore[unpinned-images]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Plugin components must exist before the tests: the plugin-host discovery/interpreter tests
      # load the built wasm from target/plugins. `plugins/*` are excluded from the workspace, so only
      # this xtask builds them (and building them is itself the plugin lint/compile check).
      - name: build plugin components
        run: cargo xtask build-plugins
      # Everything except the postgres integration tests, which need a Docker daemon. GitHub blocks
      # `--network host` on container jobs and puts spawned testcontainers on an unreachable network,
      # so those run in the native `postgres` job below instead.
      - name: test
        run: cargo nextest run --workspace --all-features --all-targets -E 'not binary_id(=genealogy-db::postgres_store)'
      # nextest does not run doctests; keep them a separate cargo step.
      - name: doctests
        run: cargo test --workspace --all-features --doc

  postgres:
    name: postgres integration tests
    # Native runner (not the container image): testcontainers needs a reachable Docker daemon, which
    # only works outside a container job. genealogy-db has no webview/UI deps, so no apt setup is
    # needed; the test-containers-util helper starts and reuses the `genealogy-pg` container.
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable, pinned 2026-06-19
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Pre-pull so the first test doesn't race the image pull (testcontainers reuses one
      # `genealogy-pg` container, isolating each test in its own database).
      - name: pre-pull postgres image
        run: docker pull postgres:18-alpine
      - name: test
        run: cargo test -p genealogy-db --features postgres

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check
