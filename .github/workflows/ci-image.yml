name: CI image

# Builds the custom CI build image and pushes it to GHCR. ci.yml consumes
# ghcr.io/magne/vitni-ci:latest. On pull requests the image is built but NOT pushed (validates
# the Dockerfile); pushes to main and manual dispatch publish it.
on:
  push:
    branches: [main]
    paths:
      - ".github/docker/ci.Dockerfile"
      - ".github/workflows/ci-image.yml"
  pull_request:
    paths:
      - ".github/docker/ci.Dockerfile"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/magne/vitni-ci
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/docker/ci.Dockerfile
          # amd64 now, arm64-ready: the Dockerfile is arch-aware, so publishing arm64 later is
          # just adding `,linux/arm64` here (and an arm64 builder). Deferred until CI runs arm64 jobs.
          platforms: linux/amd64
          # Build-only on PRs (validates the Dockerfile); publish on main + manual dispatch.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
