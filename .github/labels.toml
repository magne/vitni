# Label taxonomy — the source of truth for this repository's issue labels.
#
# Version-controlled rather than clicked into the web UI, so the taxonomy is reviewable and cannot
# drift silently — the same posture the repo already takes with i18n completeness, CSS tokens, and the
# framework-free boundary. Rationale for each group: `docs/issue-tracking.md` §2.
#
#   cargo xtask labels            # show the plan (create / update / extra), change nothing
#   cargo xtask labels --apply    # create and update to match this file
#
# Labels present on GitHub but absent here are reported as `extra` and never deleted: GitHub's
# defaults (`bug`, `documentation`, `good first issue`, `help wanted`, `wontfix`, `dependencies`, …)
# are deliberately reused, and Dependabot applies some of them itself.
#
# `area/*` mirrors the H3 headings under the four *backlog* H2s of `docs/issues.md`. The H3s under
# `## Decided — no action needed` are deliberately absent: they group decisions, not work.

