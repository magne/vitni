[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# AGPL-3.0-or-later, not the workspace default: this is an application crate (ADR 0034 §1).
license = "AGPL-3.0-or-later"
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# Reuses the plugin bundle signing primitive (ADR 0014): `build-plugins` emits each plugin's
# signature + manifest sidecars with `vitni_plugin_host::signing`. There is no dependency cycle
# (nothing depends on `xtask`), so the module is reused rather than split into a separate crate.
vitni-plugin-host = { workspace = true }
# `gui-pass` seeds the fixture's media record, so it must spell the stored `media/…` path the same way
# every other layer does — `vitni_core::media_path` is that one owner (#301). `match-eval` scores its
# corpus with `vitni_core::matching` (ADR 0038 §9). Already in the graph via `vitni-plugin-host`.
vitni-core = { workspace = true }

# `backup-fixture` builds the golden backup fixtures (ADR 0041 §5) from typed events of every
# variant, through the same store and backup use-cases a user runs, so a fixture is a real archive.
vitni-app = { workspace = true }
vitni-db = { workspace = true }
cqrs-es = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }

# `gui-pass`'s `wm-close` step: `xdotool windowclose` is `XDestroyWindow`, which never reaches the
# app, so a window-manager close is scripted as a `WM_DELETE_WINDOW` ClientMessage instead. This is a
# second copy in the graph: global-hotkey, which dioxus-desktop pulls in, still pins x11rb 0.13.
x11rb = "0.14"

# `screenshots` pins the demo seed's clock so the README images are reproducible (#328): it rewrites
# every stored assertion's `occurred_at` in the fixture's SQLite event log, then has the CLI rebuild
# the projections from it. Reaching the log needs a driver and a runtime; `time` formats the pinned
# instants and `serde_json` edits the payloads. All four are already in the graph via `vitni-db` and
# `vitni-core`, so nothing new is compiled for them.
sqlx = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

# `icons` rasterises the committed SVG icon sources into the installed PNG sizes (#326). In-process so
# a regenerated icon depends on `Cargo.lock` alone rather than on whichever SVG renderer a machine
# happens to have; `default-features = false` drops text shaping (fontdb, system fonts) — the icon
# sources are pure geometry.
resvg = { version = "0.48", default-features = false }

# `regen-fixtures` prunes the fetched Digitalarkivet pages to the elements the parser reads (ADR 0042
# §4), so it takes those selectors from `vitni-digitalarkivet` itself and walks the page with the same
# HTML parser. None of the three adds a crate to `Cargo.lock`.
vitni-digitalarkivet = { workspace = true }
scraper = { workspace = true }
# The tree `scraper` parses into, named for the set of kept node ids; the version `scraper` pins.
ego-tree = "0.11.0"

# Duplicated (the `[lints]` table can't both inherit and override). xtask is a developer
# task runner whose stdout/stderr is its interface, so the print lints are relaxed — same
# relaxation vitni-cli takes. Keep this list in sync with the workspace lint set.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "allow"
print_stderr = "allow"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
