[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# Reuses the plugin bundle signing primitive (ADR 0014): `build-plugins` emits each plugin's
# signature + manifest sidecars with `genealogy_plugin_host::signing`. There is no dependency cycle
# (nothing depends on `xtask`), so the module is reused rather than split into a separate crate.
genealogy-plugin-host = { workspace = true }

# `gui-pass`'s `wm-close` step: `xdotool windowclose` is `XDestroyWindow`, which never reaches the
# app, so a window-manager close is scripted as a `WM_DELETE_WINDOW` ClientMessage instead. Not a new
# crate in the graph — dioxus-desktop already pulls x11rb in through global-hotkey.
x11rb = "0.14"

# Duplicated (the `[lints]` table can't both inherit and override). xtask is a developer
# task runner whose stdout/stderr is its interface, so the print lints are relaxed — same
# relaxation genealogy-cli takes. Keep this list in sync with the workspace lint set.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "allow"
print_stderr = "allow"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
